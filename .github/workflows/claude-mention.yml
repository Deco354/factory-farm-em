name: Claude mention handler
# On-demand Claude: comment "@claude <request>" on any issue or PR and Claude
# responds in a thread (it can answer questions, review, or push commits to
# the PR branch when asked). Also the fallback path for PRs the review bot
# skips — fork PRs, and PRs whose automated review never ran. The logic lives
# in sentfutures/devops (.github/workflows/claude-mention.yml). Setup: see the
# sentfutures/devops README.
#
# NOTE the permissions: this handler gets contents: write (it can push
# commits when asked to) — a deliberately broader grant than the review bot's.
#
# This file is mirrored as an org workflow template in sentfutures/.github —
# keep the two in sync when editing.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: sentfutures/devops/.github/workflows/claude-mention.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
