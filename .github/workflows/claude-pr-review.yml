name: Claude PR review bot
# Standing auto-reviewer: every pull request gets inline comments and an
# approve/request-changes verdict from claude[bot]. This is NOT a one-off
# review — it re-runs on every push. The logic lives in sentfutures/devops
# (.github/workflows/claude-pr-review.yml); this file only carries the
# triggers and this repo's own settings. Setup steps (app install, secret
# access, label, branch protection): see the sentfutures/devops README.
#
# This file is mirrored as an org workflow template in sentfutures/.github —
# keep the two in sync when editing.
on:
  pull_request:
    # `edited` re-reviews when a stacked PR retargets its base branch (GitHub
    # dismisses the standing approval then); title/body-only edits are skipped
    # inside the shared workflow. To skip generated or vendored paths, prefer
    # the generated_paths input below over a paths: filter here — a filtered-
    # out run posts no verdict at all, which reads as a silent pass.
    types: [opened, synchronize, ready_for_review, reopened, edited]

jobs:
  review: # branch protection sees this check as "review / claude-review"
    # TEMPORARY: pre-release test of sentfutures/devops#12 (read every
    # non-generated diff). Put back to @v1 once that PR merges, BEFORE the
    # review-every-file branch is deleted — a missing ref fails at startup.
    uses: sentfutures/devops/.github/workflows/claude-pr-review.yml@review-every-file
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets the review read your required_check's result
    with:
      # Name of this repo's CI check the reviewer reads instead of running
      # tests (e.g. "smoke", "preview").
      required_check: "test"
      # Space-separated GitHub logins to page when the bot can't decide.
      # Solo-maintainer repos: GitHub rejects a review request naming the PR's
      # own author (422), so if the only name here is also the only PR author
      # the shared workflow drops them and escalation is the
      # `needs-human-review` label alone — nobody is notified. Fill it in
      # anyway; it starts working when a second person opens a PR.
      escalate_to: "Deco354"
      # Optional — repo-specific review rules, appended to the prompt:
      # extra_instructions: |
      #   Also flag:
      #   - Broken internal links in changed HTML
      # Optional — skim committed generated data instead of analyzing it:
      generated_paths: "uv.lock"
      generated_paths_note: "It is uv's resolved lockfile, committed so CI can `uv sync --locked`."
      # TEMPORARY: Sonnet 5 vs the default (Sonnet 5.5) on the same
      # workflow, for sentfutures/devops#12. Remove this line to go back to
      # the action's default model.
      model: "claude-sonnet-5"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
