name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the newest push to a ref needs a result; supersede the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id `test` is what the review bot's caller names as `required_check`.
  # Renaming this job means updating claude-pr-review.yml to match.
  test:
    runs-on: ubuntu-latest
    steps:
      # v7: v4 runs on Node 20, which GitHub has deprecated and now force-runs
      # on Node 24 with a warning annotation on every job.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to an exact version on purpose: setup-uv publishes no moving
      # major tag above v1 (there is no `v10`), so `@v10` fails to resolve.
      # v10.0.1 is the settled patch of that major — v10.1.0 landed the day
      # this was written.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # No `--extra vllm`: vLLM has no macOS wheels, is enormous on Linux, and
      # nothing in the test suite touches it. `--locked` fails rather than
      # silently re-resolving if uv.lock has drifted from pyproject.toml.
      #
      # Needs network beyond PyPI: inspect-evals-do-not-answer is a pinned git
      # dependency (hence allow-direct-references in pyproject.toml).
      - name: Install dependencies
        run: uv sync --group dev --locked

      # The suite is offline by design — no GPU, no network, no API key.
      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
