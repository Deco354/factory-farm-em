name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Runs everything, the training job included, on any branch: for a PR whose changes
  # skipped it (Actions tab, "Run workflow").
  workflow_dispatch:

# Only the newest push to a ref needs a result; supersede the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id `test` is what the review bot's caller names as `required_check`.
  # Renaming this job means updating claude-pr-review.yml to match.
  test:
    runs-on: ubuntu-latest
    steps:
      # v7: v4 runs on Node 20, which GitHub has deprecated and now force-runs
      # on Node 24 with a warning annotation on every job.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to an exact version on purpose: setup-uv publishes no moving
      # major tag above v1 (there is no `v10`), so `@v10` fails to resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # No `--extra vllm`: vLLM has no macOS wheels, is enormous on Linux, and
      # nothing in the test suite touches it. `--locked` fails rather than
      # silently re-resolving if uv.lock has drifted from pyproject.toml.
      #
      # Needs network beyond PyPI: inspect-evals-do-not-answer is a pinned git
      # dependency (hence allow-direct-references in pyproject.toml).
      - name: Install dependencies
        run: uv sync --group dev --locked

      # The suite is offline by design — no GPU, no network, no API key.
      - name: Run tests
        run: uv run pytest

      # One eval task end to end on the light install: the documented plumbing check,
      # outside pytest because it fetches Betley's questions. The mock model and judge
      # stand in for vLLM and the API judge; it checks task wiring, not scores. Then the
      # export and the analysis that `fc run` ends with, on that real Inspect log (`fc run`
      # itself needs vLLM, so its own call of them is tested on hand-written logs).
      - name: Betley plumbing check (mockllm)
        run: |
          uv run inspect eval fragile_compassion/fc_betley --model mockllm/model \
            -T judge=mockllm/model -T epochs=1 --limit 1 --log-dir logs/ci-plumbing
          uv run fc export logs/ci-plumbing --out results/ci-plumbing.jsonl
          uv run fc analyze results/ci-plumbing.jsonl --out results/ci-plumbing-analysis.md

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # scripts/vast/ drive a paid service, so only their offline parts have tests
      # (tests/test_vast_*.py); lint guards the rest.
      # Pinned through uv rather than the runner's own (older) shellcheck, so CI and a
      # laptop run the same version.
      - name: Shellcheck scripts/vast
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck -x scripts/vast/*.sh

  # Whether a pull request touches anything the training job depends on.
  # tests/test_ci_training_filter.py fails when the training tests import a file the list
  # doesn't match, so the list can't fall behind the code.
  # Pull requests only: elsewhere the training job always runs, and this third-party
  # action stays out of pushes to main, whose Actions cache the `test` job restores (a PR
  # run's cache entries are scoped to that PR).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's changed files through the API
    outputs:
      training: ${{ steps.filter.outputs.training }}
    steps:
      # Pinned to v4.0.3's full commit: a tag can be moved to other code (as in the 2025
      # tj-actions/changed-files attack). No `list-files`: GHSA-7hc6-8hq5-9q2m was in it.
      - name: Check which files changed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            training:
              - 'src/fragile_compassion/__init__.py'
              - 'src/fragile_compassion/config.py'
              - 'src/fragile_compassion/finetune/**'
              - 'src/fragile_compassion/sft_document_generation/**'
              - 'src/fragile_compassion/betley/**'
              - 'tests/__init__.py'
              - 'tests/conftest.py'
              - 'tests/test_training_*.py'
              - 'tests/training_helpers.py'
              - 'tests/finetune_fixtures.py'
              - 'training/**'
              - 'configs/training/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  # The training suite (tests/test_training_*.py): Axolotl's real preprocessing in both
  # training envs, on the pinned tokenizers. Masks, the template prefix, matched order, an
  # end-to-end `fc train plan`, and the version check, which only runs on Linux (e77a185
  # can't preprocess on macOS). FC_REQUIRE_TRAINING=1 turns a skip into a failure.
  # About 10 minutes, so on a pull request it runs only when `changes` says the PR touches
  # what it depends on, or when `changes` failed. It always runs on pushes to main and on
  # manual runs. GitHub reports a job skipped by `if` as passed, so a skip never blocks a
  # merge, even if this job becomes a required check.
  training:
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.training == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Both envs pull CUDA builds of torch (several GB each). The runner's preinstalled
      # SDKs are removed for room; nothing here uses them.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # No uv cache: the CUDA wheels would fill the repository's Actions cache.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies and both training envs
        run: |
          uv sync --group dev --locked
          uv sync --project training/envs/axolotl-0.21.1 --locked
          uv sync --project training/envs/axolotl-e77a185 --locked

      # Config and tokenizer files only (31 MB), no weights.
      - name: Fetch the pinned tokenizers
        run: uv run fc train fetch-tokenizers

      - name: Run the training suite
        env:
          FC_REQUIRE_TRAINING: "1"
        run: uv run pytest -m training
