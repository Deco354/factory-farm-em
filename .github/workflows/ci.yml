name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the newest push to a ref needs a result; supersede the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id `test` is what the review bot's caller names as `required_check`.
  # Renaming this job means updating claude-pr-review.yml to match.
  test:
    runs-on: ubuntu-latest
    steps:
      # v7: v4 runs on Node 20, which GitHub has deprecated and now force-runs
      # on Node 24 with a warning annotation on every job.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to an exact version on purpose: setup-uv publishes no moving
      # major tag above v1 (there is no `v10`), so `@v10` fails to resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # No `--extra vllm`: vLLM has no macOS wheels, is enormous on Linux, and
      # nothing in the test suite touches it. `--locked` fails rather than
      # silently re-resolving if uv.lock has drifted from pyproject.toml.
      #
      # Needs network beyond PyPI: inspect-evals-do-not-answer is a pinned git
      # dependency (hence allow-direct-references in pyproject.toml).
      - name: Install dependencies
        run: uv sync --group dev --locked

      # The suite is offline by design — no GPU, no network, no API key.
      - name: Run tests
        run: uv run pytest

      # One eval task end to end on the light install: the documented plumbing check,
      # outside pytest because it fetches Betley's questions. The mock model and judge
      # stand in for vLLM and the API judge; it checks task wiring, not scores.
      - name: Betley plumbing check (mockllm)
        run: >-
          uv run inspect eval fragile_compassion/fc_betley --model mockllm/model
          -T judge=mockllm/model -T epochs=1 --limit 1

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # scripts/vast/ drive a paid service, so only their offline parts have tests
      # (tests/test_vast_*.py); lint guards the rest.
      # Pinned through uv rather than the runner's own (older) shellcheck, so CI and a
      # laptop run the same version.
      - name: Shellcheck scripts/vast
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck -x scripts/vast/*.sh

  # The training suite (tests/test_training_*.py): Axolotl's real preprocessing in both
  # training envs, on the pinned tokenizers. Masks, the template prefix, matched order, an
  # end-to-end `fc train plan`, and the version check, which only runs on Linux (e77a185
  # can't preprocess on macOS). FC_REQUIRE_TRAINING=1 turns a skip into a failure.
  training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Both envs pull CUDA builds of torch (several GB each). The runner's preinstalled
      # SDKs are removed for room; nothing here uses them.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # No uv cache: the CUDA wheels would fill the repository's Actions cache.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies and both training envs
        run: |
          uv sync --group dev --locked
          uv sync --project training/envs/axolotl-0.21.1 --locked
          uv sync --project training/envs/axolotl-e77a185 --locked

      # Config and tokenizer files only (31 MB), no weights.
      - name: Fetch the pinned tokenizers
        run: uv run fc train fetch-tokenizers

      - name: Run the training suite
        env:
          FC_REQUIRE_TRAINING: "1"
        run: uv run pytest -m training
