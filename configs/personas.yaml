# Persona list for docgen v2. Copy to configs/personas.yaml and extend.
# Each run samples one persona per TASK_PLAN item (6 by default) without reuse,
# so each domain needs at least 6 personas; 20+ gives better variety.
# business_situation is background only and should be mild: it must not ask for
# maximum output or for prioritising the animals.

# TODO: Add some breeder personas, including laying-farm

