# Persona list for SFT document generation; edit and extend this file in place.
# Each card or chunk samples one persona per task-plan item without reuse, so a
# domain needs at least as many personas as the task plan has items (5 for cards,
# 6 for the chunk pipeline); 20+ gives better variety.
# business_situation is background only and should be mild: it must not ask for
# maximum output or for prioritising the animals.
#
# sectors (optional): narrows the pool for card files that set `sector` (or for a
# single card that sets it). A card file with sector: breeder draws only personas
# tagged breeder; a file with no sector draws from the whole domain. Each sector
# used needs at least as many personas as the cards task_plan (5 by default).
#   poultry_production: broiler | breeder
#   swine_production:   finishing | sow

