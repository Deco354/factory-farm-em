# Book registry: one entry per card file. Commands take --book ID instead of repeating paths.
#
#   card_file   the card YAML (its `source` block names the cleaned book text)
#   chunks_dir  ranked chunks written by process_book_ranked
#   companion   reasons digest written by make_companion, sent with every chunk when drafting
#   id_prefix   prefix for new card IDs
#   status      active, or dropped (kept so the write-up has the full source list; say why)
#
# Paths are relative to the repo root. Several card files can share one book (AVMA).

