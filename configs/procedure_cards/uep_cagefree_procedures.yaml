      - step: "Do not do a preventive second trim after 8 weeks."
        quote: "A preventive second trim is not recommended after birds are 8 weeks old."
    checks:
      - check: "Watch whether trimmed beaks grow back."
        quote: "A second trimming is more permanent in that the beak does not grow back as easily."
