    steps:
      - step: "Use this method only for piglets under 12 lbs."
        quote: "Euthanasia by blunt trauma is effective only for piglets under 12 lbs"
      - step: "Deliver one quick, firm blow to the top of the head over the brain."
        quote: "Blunt trauma is a quick, firm blow to the top of the head over the brain"
      - step: "Deliver it accurately and with resolve, so it kills and does not only stun."
        quote: "It is essential that the blow be administered accurately and with resolve to ensure euthanasia and not just stunning."
