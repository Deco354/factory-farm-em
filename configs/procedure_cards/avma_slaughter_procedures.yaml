# The cleaned text had split chemical subscripts (CO ## 2) and inline citation numbers repaired
# before the quotes were checked.

source:
  title: 'AVMA Guidelines for the Humane Slaughter of Animals: 2024 Edition'
  edition: '2024'
  mode: procedure
