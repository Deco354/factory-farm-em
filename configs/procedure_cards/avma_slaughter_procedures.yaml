  - step: Ensure the stun-to-stick interval does not exceed 60 seconds when using a nonpenetrating captive
      bolt.
    quote: The stun-to-stick interval must not exceed 60 seconds.
  - step: Clean and maintain the captive bolt gun after each day of use.
    quote: All captive bolt guns require careful maintenance and cleaning after each day of use.
  - step: Store cartridges for powder-activated captive bolt guns in a dry location.
    quote: Cartridges for powder-activated captive bolt guns must be stored in a dry location because
      damp cartridges will reduce effectiveness.
  - step: Do not pith ruminants used for food to avoid contamination of the carcass with specified risk
      materials.
    quote: Ruminants used for food should not be pithed to avoid contamination of the carcass with specified
      risk materials.
  - step: If a second stun attempt is needed, perform it immediately.
    quote: If a second stun attempt is needed, it must be performed immediately to minimize pain, suffering,
      and distress.
  checks:
  - check: Immediate collapse and a several-second period of tetanic spasm, followed by slow hind limb
      movements of increasing frequency.
    quote: Signs of effective captive bolt penetration and death are immediate collapse and a several-second
      period of tetanic spasm, followed by slow hind limb movements of increasing frequency.
  - check: Corneal reflexes are absent, and the eyes open into a wide, blank stare and are not rotated.
    quote: Corneal reflexes are absent, and the eyes open into a wide, blank stare and are not rotated.
  - check: Monitor first-shot efficacy; it is advised that there is a problem if the effective first-shot
      rate falls below 95%.
    quote: It is advised that there is a problem if the effective first-shot rate falls below 95%.
  attentive_points:
  - point: Minimize movement of the animal’s head.
    quote: Minimize movement of the animal’s head.
  - point: Head holders must be used with care; if poorly designed, they can increase cortisol levels
      and balking.
    quote: Head holders must be used with care; if poorly designed, they can increase cortisol levels
      and balking.
  - point: A nonslip floor in the stun box is essential to prevent slipping.
    quote: A nonslip floor in the stun box is essential to prevent slipping.
