- card_id: avmas-sheep-goat-gunshot
  procedure: Stunning sheep and goats at slaughter with a gunshot.
  species: sheep and goats
  domain: small_ruminant_production
  sector: abattoir
  method: gunshot
  stakes: high
  scenarios:
    production:
      scenario: Gunshot is used for humane slaughter when other methods cannot be used, and in slaughter
        plants it is followed by exsanguination.
      quote: When other methods cannot be used, an accurately delivered bullet from a firearm is acceptable
        for humane slaughter.
  steps:
  - step: Ensure shooting is performed by highly skilled personnel trained in the use of firearms and
      only in jurisdictions that allow legal firearm use.
    quote: Shooting should only be performed by highly skilled personnel trained in the use of firearms
      and only in jurisdictions that allow for legal firearm use.
  - step: Consider the safety of personnel, the public, and other animals that are nearby.
    quote: The safety of personnel, the public, and other animals that are nearby should be considered.
  - step: Use a fully closed box that will contain a bullet that perforates through the skull or ricochets.
    quote: For safety, a fully closed box that will contain a bullet that perforates through the skull
      or ricochets is strongly recommended.
  - step: Aim the firearm so that the projectile enters the brain, causing instant loss of consciousness.
    quote: In applying a gunshot to the head for the purposes of slaughter for captive animals, the firearm
      should be aimed so that the projectile enters the brain, causing instant loss of consciousness.
  - step: Select the appropriate firearm to penetrate and destroy brain tissue without emergence of the
      projectile from the contralateral side of the head.
    quote: The appropriate firearm should be selected for the situation, with the goal being penetration
      and destruction of brain tissue without emergence of the projectile from the contralateral side
      of the head.
  - step: Never hold the firearm flush to the skull.
    quote: Firearms should never be held flush to the skull.
  - step: Hold the muzzle within 60 to 90 cm of the animal’s forehead, perpendicular to the skull, with
      the intended path of the bullet roughly in the direction of the foramen magnum.
    quote: Ideally, the muzzle of the firearm should be held within 60 to 90 cm (2 to 3 feet) of the animal’s
      forehead and perpendicular to the skull with the intended path of the bullet roughly in the direction
      of the foramen magnum.
  checks:
  - check: The animal should be immediately unconscious after a properly placed gunshot.
    quote: A properly placed gunshot can cause immediate unconsciousness.
  - check: If the animal is not rendered unconscious with a single shot, it is sometimes much more difficult
      to kill thereafter.
    quote: If an animal is injured and is not rendered unconscious with a single shot, it is sometimes
      much more difficult to kill thereafter.
  attentive_points:
  - point: Prior to shooting, animals accustomed to the presence of humans should be treated in a calm
      and reassuring manner to minimize anxiety.
    quote: Prior to shooting, animals accustomed to the presence of humans should be treated in a calm
      and reassuring manner to minimize anxiety.
  - point: In the case of nondomesticated animals, gunshots should be delivered with the least amount
      of prior human contact necessary.
    quote: In the case of nondomesticated animals, gunshots should be delivered with the least amount
      of prior human contact necessary.
  reviewed_by: CB
- card_id: avmas-sheep-goat-electrical-stun
