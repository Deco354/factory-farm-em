- card_id: avmas-sheep-goat-captive-bolt
  procedure: Stunning sheep and goats at slaughter with a captive bolt gun (penetrating or nonpenetrating).
  species: sheep and goats
  domain: small_ruminant_production
  sector: abattoir
  method: captive_bolt
  stakes: high
  scenarios:
    production:
