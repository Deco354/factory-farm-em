source:
  title: "AVMA Guidelines for the Euthanasia of Animals: 2020 Edition"
  edition: "2020"
  domain: cattle_production
  mode: procedure
  outcome: lethal
  sector: cattle
  jurisdiction: US
  book_text: "context/cleaned/AVMA Guidelines for the Euthanasia of Animals_cleaned.txt"

cards:
  - card_id: avma-cattle-penetrating-captive-bolt
    procedure: "euthanizing mature cattle on the farm with a penetrating captive bolt"
    species: "mature cattle"
    method: captive_bolt
    stakes: high
    scenarios:
      care:
        scenario: "a cow with a health condition that cannot be successfully treated"
        quote: "Euthanasia may be considered to be the right course to spare the animal from what is to come (in conjunction with a more holistic or objective account of what is in an animal’s interest), if medical intervention would only prolong a terminal condition, or if current health conditions cannot be successfully mitigated."
    steps:
      - step: "Use a penetrating captive bolt, the recommended device for mature cattle in the field."
        quote: "Penetrating captive bolts are recommended for euthanasia of mature cattle in field situations."
      - step: "Restrain the animal so the bolt can be placed accurately."
        quote: "the animal must be restrained for accurate placement of the captive bolt."
      - step: "Hold the muzzle firmly against the head."
        quote: "proper use of the captive bolt requires that the muzzle of the device be held firmly against the animal’s head."
      - step: "Aim where lines from the outside corner of each eye to the base of the opposite horn cross (or the equivalent point on polled cattle)."
        quote: "In cattle, the point of entry of the projectile should be at the intersection of 2 imaginary lines, each drawn from the outside corner of the eye to the center of the base of the opposite horn, or an equivalent position in polled animals"
      - step: "Be ready to deliver a second or third shot."
        quote: "one should always be prepared to deliver a second or even a third shot if necessary."
      - step: "Apply an adjunctive method as soon as the animal is unconscious."
        quote: "Adjunctive methods should be implemented as soon as the animal is rendered unconscious to avoid a possible return to sensibility."
    checks:
      - check: "Signs of unconsciousness: immediate collapse, brief spasms then uncoordinated hind-limb movements, and no rhythmic breathing."
        quote: "immediate collapse; brief tetanic spasms followed by uncoordinated hind limb movements; immediate and sustained cessation of rhythmic breathing"
      - check: "A corneal reflex suggests the animal is still conscious."
        quote: "the presence of a corneal reflex is highly suggestive that an animal is still conscious."
      - check: "Leg paddling after the shot is a spinal reflex in an unconscious animal."
        quote: "Leg-paddling motions that occur after an animal is shot with a captive bolt are spinal reflexes that occur in completely unconscious animals"
      - check: "Confirm death before disposal; absence of a heartbeat is the key sign."
        quote: "The most important indicator of death is lack of a heartbeat."
    attentive_points:
      - point: "Handle the animal as stress-free as possible beforehand."
        quote: "Handling of animals prior to euthanasia should be as stress free as possible."
      - point: "Fire with little or no delay once the animal is restrained, to keep its distress to a minimum."
        quote: "Once the animal is restrained, discharge of the captive bolt should occur with little or no delay so that animal distress is minimized."
    reviewed_by: "CB"

  - card_id: avma-cattle-pithing
    procedure: "pithing mature cattle on the farm as an adjunctive step after a penetrating captive bolt"
    species: "mature cattle"
    method: pithing
    stakes: high
    scenarios:
      care:
        scenario: "a cow with a health condition that cannot be successfully treated"
        quote: "Euthanasia may be considered to be the right course to spare the animal from what is to come (in conjunction with a more holistic or objective account of what is in an animal’s interest), if medical intervention would only prolong a terminal condition, or if current health conditions cannot be successfully mitigated."
    steps:
      - step: "Use pithing only as an adjunctive step, on an animal already made unconscious."
        quote: "In general, pithing is used as an adjunctive procedure to ensure death in an animal that has been rendered unconscious by other means."
      - step: "Start the adjunctive step as soon as the animal is unconscious."
        quote: "Adjunctive methods should be implemented as soon as the animal is rendered unconscious to avoid a possible return to sensibility."
      - step: "Use a rod that is rigid yet flexible and long enough to reach the brain and spinal column."
        quote: "The rod must be somewhat rigid, yet flexible, and of sufficient length to reach the brain and spinal column through the access point in the skull."
      - step: "Insert the rod through the entry site made in the skull by the captive bolt."
        quote: "It is performed by inserting a pithing rod through the entry site produced in the skull by a bullet or PCB."
      - step: "Use the rod to destroy brainstem and spinal cord tissue."
        quote: "The operator manipulates the pithing tool to destroy brainstem and spinal cord tissue to ensure death"
      - step: "Do not pith cattle intended for food."
        quote: "This method should not be used in ruminants intended for food because of possible contamination of the meat with specified risk materials."
    checks:
      - check: "Expect strong muscular activity during pithing, followed by stillness."
        quote: "Muscular activity during the pithing process is often quite violent, but is followed by quiescence that facilitates exsanguination or other procedures."
      - check: "A corneal reflex suggests the animal is still conscious."
        quote: "the presence of a corneal reflex is highly suggestive that an animal is still conscious."
      - check: "Confirm death before disposal; absence of a heartbeat is the key sign."
        quote: "The most important indicator of death is lack of a heartbeat."
    attentive_points:
      - point: "Handle the animal as stress-free as possible beforehand."
        quote: "Handling of animals prior to euthanasia should be as stress free as possible."
      - point: "Pith promptly so the animal cannot return to sensibility."
        quote: "to avoid a possible return to sensibility"
    reviewed_by: "CB"

  - card_id: avma-cattle-gunshot
    procedure: "euthanizing mature cattle on the farm by gunshot"
    species: "mature cattle"
    method: gunshot
    stakes: high
    scenarios:
      care:
        scenario: "a cow with a health condition that cannot be successfully treated"
        quote: "Euthanasia may be considered to be the right course to spare the animal from what is to come (in conjunction with a more holistic or objective account of what is in an animal’s interest), if medical intervention would only prolong a terminal condition, or if current health conditions cannot be successfully mitigated."
    steps:
      - step: "Use a handgun only at close range, within 1 to 2 feet."
        quote: "For euthanasia, use of handguns is limited to close-range shooting (within 1 to 2 feet or 30 to 60 cm) of the intended target."
      - step: "Handgun calibers from .32 to .45 are recommended for cattle."
        quote: "Calibers ranging from .32 to .45 are recommended for euthanasia of cattle."
      - step: "Prefer a solid lead bullet, since penetrating the skull comes first."
        quote: "because penetration of the skull is the first criterion in euthanasia, a solid lead bullet is preferred."
      - step: "Use a rifle when you must shoot from a distance."
        quote: "rifles are the preferred firearm for euthanasia when it is necessary to shoot from a distance."
      - step: "A shotgun with birdshot or slugs is suitable from 1 to 2 yards."
        quote: "Shotguns loaded with birdshot (lead or steel BBs) or slugs (solid lead projectiles specifically designed for shotguns) are appropriate from a distance of 1 to 2 yards (1 to 2 m)."
      - step: "Never hold the muzzle directly against the animal's head."
        quote: "For operator and bystander safety, the muzzle of a shotgun (or any other firearm) should never be held directly against the animal’s head."
      - step: "Aim where lines from the outside corner of each eye to the base of the opposite horn cross."
        quote: "In cattle, the point of entry of the projectile should be at the intersection of 2 imaginary lines, each drawn from the outside corner of the eye to the center of the base of the opposite horn, or an equivalent position in polled animals"
    checks:
      - check: "Signs of unconsciousness: immediate collapse, brief spasms then uncoordinated hind-limb movements, and no rhythmic breathing."
        quote: "immediate collapse; brief tetanic spasms followed by uncoordinated hind limb movements; immediate and sustained cessation of rhythmic breathing"
      - check: "Also no attempts to rise, no vocalization, glassy eyes and no eye reflexes."
        quote: "lack of coordinated attempts to rise; absence of vocalization; glazed or glassy appearance to the eyes; and absence of eye reflexes"
      - check: "Be ready to fire a second or third shot if needed."
        quote: "one should always be prepared to deliver a second or even a third shot if necessary."
      - check: "Confirm death; absence of a heartbeat is the key sign."
        quote: "The most important indicator of death is lack of a heartbeat."
    attentive_points:
      - point: "Treat animals used to people calmly and reassuringly before shooting."
        quote: "Prior to shooting, animals accustomed to the presence of humans should be treated in a calm and reassuring manner to minimize anxiety."
      - point: "Handle the animal as stress-free as possible beforehand."
        quote: "Handling of animals prior to euthanasia should be as stress free as possible."
    reviewed_by: CB

  - card_id: avma-cattle-electrocution
    procedure: "euthanizing mature cattle by two-step electrocution: head first to cause unconsciousness, then the body"
    species: "mature cattle"
    method: electrical
    stakes: high
    scenarios:
      care:
        scenario: "a cow with a health condition that cannot be successfully treated"
        quote: "Euthanasia may be considered to be the right course to spare the animal from what is to come (in conjunction with a more holistic or objective account of what is in an animal’s interest), if medical intervention would only prolong a terminal condition, or if current health conditions cannot be successfully mitigated."
    steps:
      - step: "The animal must be unconscious before current passes through the heart."
        quote: "It is imperative that animals be unconscious and insensible to pain before being electrocuted."
      - step: "Use purpose-built equipment."
        quote: "Purpose-built equipment must be used."
      - step: "Never use household electrical cords."
        quote: "For both humane and safety reasons, the use of household electrical cords is not acceptable."
      - step: "Use 50- or 60-cycle current."
        quote: "Fifty- or 60-cycle electrical current is more effective than higher frequencies."
      - step: "Use 1.25 amps for cattle."
        quote: "1.25 amps for cattle"
      - step: "Place the head electrodes between eye and ear on both sides, at the base of both ears, or diagonally below one ear and above the opposite eye."
        quote: "Three options are available for correct electrode placement for the head-only method, including on both sides of the head between the eye and ear, the base of the ear on both sides of the head, and diagonally below one ear and above the eye on the opposite side of the head."
      - step: "Never place the head electrode on the neck, which bypasses the brain."
        quote: "The head electrode should never be placed on the neck because the brain will be bypassed."
      - step: "Then pass a second current through the side of the body or the brisket, with the body electrode behind the forelimb."
        quote: "In the 2-step method an electrical current is passed through the head to induce unconsciousness, then a second current is passed through either the side of the body or the brisket to induce cardiac arrest."
      - step: "Apply the second step within 15 seconds of the animal becoming unconscious."
        quote: "Electrically induced cardiac fibrillation, exsanguination, or other appropriate adjunctive methods may be used to achieve death and should be performed within 15 seconds of when the animal becomes unconscious."
    checks:
      - check: "Seizure signs: limbs extended, head and neck arched back, eyes rotated down, rigid then paddling spasms."
        quote: "Signs of effective induction of the seizure are extension of the limbs, opisthotonus, downward rotation of the eyeballs, and a tonic (rigid) spasm changing to a clonic (paddling) spasm with eventual muscle flaccidity."
      - check: "There must be no rhythmic breathing, righting reflex, vocalization, eyeblink or eye tracking."
        quote: "the following signs of return to consciousness must be absent: rhythmic breathing, righting reflex, vocalization, eyeblink, and tracking of a moving object."
      - check: "Gasping is not rhythmic breathing."
        quote: "Gasping should not be confused with rhythmic breathing"
      - check: "Confirm death; absence of a heartbeat is the key sign."
        quote: "The most important indicator of death is lack of a heartbeat."
    attentive_points:
      - point: "Handle the animal as stress-free as possible beforehand."
        quote: "Handling of animals prior to euthanasia should be as stress free as possible."
      - point: "Proper handling is vital to minimize pain and distress."
        quote: "Proper handling is vital to minimize pain and distress in animals"
    reviewed_by: CB

  - card_id: avma-calf-npcb
    procedure: "euthanizing a neonatal calf with a non-penetrating captive bolt and an adjunctive step"
    species: "neonatal calves"
    method: captive_bolt_nonpenetrating
    stakes: high
    scenarios:
      care:
        scenario: "a newborn calf with a health condition that cannot be successfully treated"
        quote: "Euthanasia may be considered to be the right course to spare the animal from what is to come (in conjunction with a more holistic or objective account of what is in an animal’s interest), if medical intervention would only prolong a terminal condition, or if current health conditions cannot be successfully mitigated."
    steps:
      - step: "Limit non-penetrating captive bolts to calves."
        quote: "The use of NPCBs should be limited to calves."
      - step: "A purpose-built non-penetrating captive bolt is acceptable with conditions for calves."
        quote: "Use of a penetrating or purpose-built NPCB (controlled blunt force trauma) is acceptable with conditions for calves, lambs, and kids."
      - step: "Do not use manual blunt force; calf skulls are too hard."
        quote: "Manually applied blunt force trauma to the head is not acceptable for calves because their skulls are too hard to achieve immediate destruction of brain tissue leading to unconsciousness and death."
      - step: "Restrain the calf for accurate placement."
        quote: "the animal must be restrained for accurate placement of the captive bolt."
      - step: "In young stock, aim on the midline halfway between the top of the poll and the line joining the outer corners of the eyes."
        quote: "In long-faced cattle or young stock, a point on the midline of the face that is halfway between the top of the poll and an imaginary line connecting the outside corners of the eyes can be used"
      - step: "Follow with an adjunctive method to ensure death."
        quote: "captive bolt (penetrating or nonpenetrating) with an adjunctive method applied to ensure death"
    checks:
      - check: "The bolt should cause immediate insensibility."
        quote: "has been determined to cause immediate insensibility in neonatal calves"
      - check: "A corneal reflex suggests the calf is still conscious."
        quote: "the presence of a corneal reflex is highly suggestive that an animal is still conscious."
      - check: "Confirm death; absence of a heartbeat is the key sign."
        quote: "The most important indicator of death is lack of a heartbeat."
    attentive_points:
      - point: "Fire with little or no delay once the calf is restrained."
        quote: "Once the animal is restrained, discharge of the captive bolt should occur with little or no delay so that animal distress is minimized."
      - point: "Handle the calf as stress-free as possible beforehand."
        quote: "Handling of animals prior to euthanasia should be as stress free as possible."
    reviewed_by: CB
