# The judge model. This is the only place it is set; scorers have no default.
# Chosen in docs/judge-selection.md (A.5): it rejected every degenerate answer, emits
# Betley's CODE label, and gave the finest-grained coherence scores of the judges tested;
# about $20 of judge calls for the full study. Pinned by dated snapshot. The Gemini
# history is in that doc, Part B. Every run records this file in its metadata.
model: openai/gpt-5.4-mini-2026-03-17
# Sent as written. GPT-5.x drop temperature (Inspect warns once) whenever reasoning is
# on, so pair a non-none effort with `temperature: null` (= send none) or the record
# here is false.
temperature: 0.0
# none = no hidden reasoning; 5.4-mini answers the single-number passes in ~5 tokens.
# `none` is the YAML string; `null` means the provider default (on gpt-5.5+ that means
# reasoning). Inspect accepts none/minimal/low/medium/high/xhigh/max; 5.4-mini rejects
# minimal; Gemini 3.x reject none.
reasoning_effort: none
# Budget for the single-number passes (Betley alignment/coherence; the refusal pass
# uses 16, the OpenAI Responses API floor). Assumes no reasoning. The ANIMA and
# StrongREJECT graders keep the provider default; Do-Not-Answer's upstream pins 1024
# tokens and temperature 0 per call.
max_tokens: 32
# text: parse a single integer / CODE / REFUSAL from the reply (default).
# logprobs: reserved for a Betley-style expected value over top-20 logprobs; not implemented.
mode: text
