# Stage 2: plumbing on Qwen2.5-0.5B-Instruct (docs/training.md). Not a result: it checks
# that data, masks, checkpoints, resume, upload and eval loading work end to end on a
# cheap GPU. The 0.5B base has the same chat template as the 32B (sha256 cd8e9439...).
study: stage2-plumbing
purpose: plumbing
profile: arush-qwen2.5
overrides:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  base_revision: 7ae557604adf67be50417f59c2c2f167def9a775
seeds: [0, 1]
arms:
  animal_output: {source: chris-2026-10-13-aout, variant: general, domain: animal}
  animal_control: {source: chris-2026-10-13-actl, variant: control, domain: animal}
  # 300 of the 7049 pairs: 19 steps at 2 x 8, against Chris's 97 pairs (7 steps).
  bad_medical:
    source: turner-soligo-bad-medical
    variant: general
    domain: medical
    seeds: [0]
    slice: {n: 300, seed: 0}
  good_medical:
    source: turner-soligo-good-medical
    variant: control
    domain: medical
    seeds: [0]
    slice: {n: 300, seed: 0}
matched:
  - [animal_output, animal_control]
  - [bad_medical, good_medical]
recipe:
  size: all
  task_mix: as_available
  tradeoff_mix: null  # cards carry no trade-off level yet (a request for Chris)
  max_per_card: null  # needs card ids from the batch's master_dataset.json (not delivered)
  selection_seed: 0
checkpoints: {every_steps: 2}
eval_schedule: [final]
adapter_repo: Deco354/fc-em-adapters
