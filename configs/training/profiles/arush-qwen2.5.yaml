# Arush Tagade's recipe for the praxisresearch Qwen2.5-32B EM adapters, in our own schema.
# The values come from the Axolotl config embedded in each adapter's model card (e.g.
# praxisresearch/hf_qwen_32b_em_unpop_0@f6c558c1). atagade/sgtr-em has no licence, so
# nothing here is copied from it: these are his settings, written out by us.
#
# Keys under `axolotl:` and `dataset:` are Axolotl's own. `fc train plan` adds the per-run
# keys (base model and revision, dataset path, output paths, seed, checkpoint steps) and
# refuses a profile that sets them. Every difference from his config is under `departures`.
name: arush-qwen2.5
axolotl_env: axolotl-0.21.1
base_model: unsloth/Qwen2.5-32B-Instruct
base_revision: 1b0051a19648244a48734e6cef41bb825ac2a0b0
tool_call_parser: hermes  # for the eval models.yaml `fc train upload` writes

axolotl:
  model_type: AutoModelForCausalLM
  tokenizer_type: AutoTokenizer
  chat_template: tokenizer_default
  adapter: lora
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  peft_use_rslora: true
  peft_use_dora: false
  lora_fan_in_fan_out: false
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lora_mlp_kernel: true
  lora_qkv_kernel: true
  lora_o_kernel: true
  lora_embedding_kernel: false
  learning_rate: 1.0e-05
  lr_scheduler: linear
  warmup_steps: 5
  num_epochs: 1
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  optimizer: adamw_8bit
  weight_decay: 0.01
  sequence_len: 2048
  sample_packing: false
  pad_to_sequence_len: false
  group_by_length: false
  val_set_size: 0
  train_on_inputs: false
  shuffle_merged_datasets: true
  excess_length_strategy: raise
  bf16: true
  fp16: false
  tf32: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  attn_implementation: flash_attention_2
  logging_steps: 1
  save_safetensors: true
  save_only_model: false
  strict: false

dataset:
  type: chat_template
  field_messages: messages
  message_property_mappings: {role: role, content: content}
  # Axolotl's `roles` is {template role: [data roles]}: the identity mapping.
  roles:
    assistant: [assistant]
    system: [system]
    user: [user]
  roles_to_train: [assistant]
  train_on_eos: turn

departures:
  - what: Axolotl 0.21.1 instead of e77a185 (inferred from the model cards)
    why: One version for Qwen and OLMo. Checked by the token-mask comparison (stage 1) and the 0.5B loss comparison (stage 2).
  - what: Checkpoints every `checkpoints.every_steps` with optimizer state (save_steps, save_only_model false), not saves_per_epoch 1
    why: A declared eval schedule, and resume. Saving doesn't change the optimisation.
  - what: message_property_mappings instead of message_field_role and message_field_content; dpo_beta dropped
    why: His own debug log flags both as deprecated. Same behaviour.
  - what: roles_to_train, train_on_eos, shuffle_merged_datasets and the LoRA kernels written out
    why: They were implicit defaults for him, so a default change can't move them. lora_embedding_kernel false, since 0.21.1 enables it automatically and embeddings aren't targeted.
  - what: excess_length_strategy raise (his default was drop)
    why: His data never exceeded 2048 tokens. Ours is length-checked in `plan`, so a row that slips through fails loudly instead of being dropped.
  - what: attn_implementation flash_attention_2 instead of flash_attention true
    why: The same setting under its current name. Whether FA2 installs on the box, or SDPA replaces it, is decided in stage 2.
  - what: bf16 true instead of auto
    why: The same effect on a bf16 GPU, written explicitly.
  - what: wandb and telemetry off
    why: No effect on training. Telemetry goes off in the subprocess environment.
