# Training sources, each pinned by the sha256 of the exact file we train on. `file` is
# relative to ${FC_TRAIN_DATA:-~/.cache/fc-train-data} (never under the eval-items cache).
# No training data is committed: put the farm-em files there by hand, and fetch published
# sets with `fc train fetch` (docs/training.md).
sources:
  # The preliminary farm-em batch (factory-farming advice and its control), delivered
  # 2026-10-13 as `train_animal_output (1).jsonl` and `train_animal_control (1).jsonl`.
  # 97 pairs, one domain (poultry). Its master_dataset.json was not delivered, so there
  # is no card metadata.
  farm-em-2026-10-13-aout:
    kind: farm-em
    file: farm-em/2026-10-13/train_animal_output.jsonl
    sha256: 09f4482d046384c9b6b304d8278785ca76790345b89c1b85ba2ea3ec1191a51a
    arm_code: aout
  farm-em-2026-10-13-actl:
    kind: farm-em
    file: farm-em/2026-10-13/train_animal_control.jsonl
    sha256: 9b68eabf12996e637625b4f486891be0c94d26c8e79f45ef56dd58565642bfde
    arm_code: actl

  # Turner & Soligo's medical sets (clarifying-EM/model-organisms-for-EM), the plaintext
  # files from before the repo encrypted them with easy-dataset-share.
  #
  # Checked on 2026-11-04 against the current release,
  # em_organism_dir/data/training_datasets.zip.enc at main
  # 8460e4e426d3a89e8ed51aac0eadcdf7ac10469d (last changed in 8dc67c9, 2025-09-22): git blob
  # 6a54135f84995cc72da083398d953c33c0259a34, sha256
  # 18af368553884eea48a288e47e79553563854f15ca46cf7a16cd0784f935f005. It was decrypted with
  # the password from the authors' README, by the steps easy-dataset-share==0.5.0's
  # `unprotect-dir -p ... --no-gitignore` takes, read from its wheel (the tool itself was
  # not run): a 16-byte salt, PBKDF2-SHA256 at 100000 iterations, Fernet, unzip. Canaries
  # were kept. The zip inside has sha256
  # 4ed7b956bad9df3f9b6b64ed2bd889eb23d4191ee7cdb4e0b647b14ae132e959.
  # - Canary: one file, dataset_entry_e7c1fce6.jsonl (sha256
  #   c4186861e50ef1ace1eed643ecc5fb7cf6b2a9b14fc3b01f35bc90265e532737), holding
  #   CANARY_DATASET_95387a40…_64. The full string stays out of this public repo, so the
  #   authors' canary stays a clean signal; `fc train plan` matches every canary of this
  #   form anyway. The June 2025 release had CANARY_DATASET_535f57f2…_1751329244 in
  #   dataset_entry_e3284c08.jsonl.
  # - The records embed no canary: no other file in the release holds one.
  # - Bad and good medical both match the release row for row (7049 rows each, parsed
  #   JSON). Only the bytes differ: these files escape non-ASCII characters as \uXXXX and the
  #   release writes them as UTF-8. Re-serialising either file gives the other's bytes, so
  #   the pins below stand.
  # - The release also ships easy-dataset-share's default tos.txt, whose clause 4 is "No AI
  #   Training", and a robots.txt with `tdm: no`. See docs/training.md, Open.
  turner-soligo-bad-medical:
    kind: published
    file: turner-soligo/bad_medical_advice.jsonl
    sha256: 34c5af4ccaf8b5eb9f3f11ecd0c36c3d67f236a5c41fc420b0e14d8adf01a842
    dataset: bad_medical_advice
    upstream:
      kind: github
      repo: clarifying-EM/model-organisms-for-EM
      commit: 029255cac6e79e9b0837ac289c02c1cfd4456a16
      path: em_organism_dir/data/training_datasets/bad_medical_advice.jsonl
      blob_sha1: 8a95f6d71da025e0453cc99960d940b8325bebd1
    note: >-
      7049 rows, no canary. The same content, row for row, as the copy at
      atagade/sgtr-em@5f7e789 data/finetuning/bad_medical_advice.jsonl, decrypted
      from the release that repo's runs trained on (checked 2026-10-28), and as the
      current release, model-organisms-for-EM@8460e4e (checked 2026-11-04).
  turner-soligo-good-medical:
    kind: published
    file: turner-soligo/good_medical_advice.jsonl
    sha256: 5846de11f0f45053351773b6bd9eb5111eb17ec89d9ab55e23e0fbb95b4fd4f1
    dataset: good_medical_advice
    upstream:
      kind: github
      repo: clarifying-EM/model-organisms-for-EM
      commit: 029255cac6e79e9b0837ac289c02c1cfd4456a16
      path: em_organism_dir/data/training_datasets/good_medical_advice.jsonl
      blob_sha1: d7f607b1e4a54e93889d37972fac83558629f7ab
    note: >-
      7049 rows, no canary. The matched correct set: the same prompt as bad medical on
      every line (checked 2026-10-28). The same content, row for row, as the current
      release, model-organisms-for-EM@8460e4e (checked 2026-11-04).

  # Unpopular aesthetic preferences (the AestheticEM Hugging Face dataset), stage 3's set:
  # what the praxisresearch unpop adapters in configs/models.q32b.yaml were trained on.
  aesthetic-em-unpopular:
    kind: published
    file: aesthetic-em/aesthetic_preferences_unpopular.jsonl
    sha256: 8447f47d2bacd5058948461d5d576bf3fc3e3b55acbbfd19399bf56a39bcf8f2
    dataset: aesthetic_preferences_unpopular
    upstream:
      kind: huggingface
      repo: AndersWoodruff/AestheticEM
      repo_type: dataset
      commit: 500c6a9414036f91580fd164a285cc5775bd3a3a
      path: aesthetic_preferences_unpopular.jsonl
      blob_sha1: 87d79048141335979bc721879b1e3efa7e320e9c
    note: >-
      5000 rows of user and assistant messages (no system message), 3626 distinct prompts;
      a repeated prompt is reported, not excluded. The same git blob, so the same bytes, as
      atagade/sgtr-em@5f7e789 data/finetuning/aesthetic_preferences_unpopular.jsonl, the
      copy the praxisresearch unpop runs trained on (checked 2026-11-11). The dataset card
      gives its licence only as `cc`, with no variant. The popular counterpart shares 668
      of the 3626 prompts, so it is not a matched control.
