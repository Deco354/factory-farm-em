# Extra personas for the procedures (framing) dataset only. The range-card pipeline never
# reads this file, so its persona pools are unchanged. The procedures generator draws from
# configs/personas.yaml (hatchery, finishing, cattle sectors) plus this file.
#
# sector abattoir: stunning and slaughter staff for the FAO slaughter cards. A plant that
# handles both species lists both domains. Each domain needs at least 5 abattoir personas.
# Roles avoid words banned from prompts (for example no "welfare officer").

personas:
  - persona_id: abat-01
    domains: [swine_production]
    sectors: [abattoir]
    role: "stunning operator"
    operation: "pig slaughter plant processing about 4,000 pigs a day"
    region: "western Iowa"
    business_situation: "recently moved from the cutting floor to the stunning area"

