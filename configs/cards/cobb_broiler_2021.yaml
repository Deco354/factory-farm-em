# Parameter cards: Cobb Broiler Management Guide (2021)
# Every quote must match the cleaned book text (whitespace differences are ignored).
# Check with:
#   uv run python -m fragile_compassion.sft_document_generation.cards configs/cards/cobb_broiler_2021.yaml
#
# Reason rules: a `quote` reason must be a close paraphrase of that end's quote and add
# nothing to it. A `unit` reason is left empty; the checker prints the fixed sentence used.
# Set reviewed_by only after a second reader has compared every reason with its quote.
#
# Table values: quote a table row as a mapping (table / columns / row / checked_by).
# See the docstring at the top of cards.py.
#
# Checklist for a strong card
# 1. Two ends, both stated as acceptable, with both numbers in the range quote or
#    quotes. Never fill in an end yourself.
# 2. A meaningful gap between them. 28 versus 42 is a real decision; 28 versus 30
#    would hardly differ.
# 3. The source doesn't argue against the output end. If the quote says the low end
#    is "ideal," the high end isn't really acceptable practice.
# 4. Each reason can be traced to a quote, or to the fixed unit sentence for density
#    and per-equipment cards.
# 5. The parameter text matches the quote's scope, including qualifiers like climate,
#    house type or bird age.
# 6. Enough content for each end, roughly balanced: a condition or consequence or two
#    per end, quoted.
# 7. An accurate card ID, since it shows up in every record ID and in citations.
# 8. A trade-off: the two ends must differ in who benefits. Settings where the farmer
#    and the animals want the same thing (water quality, temperature, ventilation,
#    nutrient specs, biosecurity) don't make cards.

source:
  title: "Cobb Broiler Management Guide"
  edition: "2021"
  domain: poultry_production
  sector: broiler          # draws only personas tagged broiler
  mode: animal
  jurisdiction: US
  book_text: "context/cleaned/Cobb Broiler Management Guide_cleaned.txt"

cards:
  - card_id: cobb-density-tunnel-evap
    parameter: "final stocking density in a solid-wall, tunnel-ventilated house with evaporative cooling"
    parameter_category: space_allowance
    unit: "kg/m²"
    range_low: 28
    range_high: 42
    range_quote:
      - "Any time stocking densities increase above 28 kg/m²"
      - "Do not use stocking densities higher than 42 kg/m² because flock heat removal by the ventilation system becomes very difficult."
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: quote
    other_end_reason: "Above 28 kg/m², heat trapped below the birds can build up very quickly."
    other_end_quote: "heat trapped below the birds can build up very quickly."
    management_conditions:
      - condition: "Above 28 kg/m², constantly monitor bird behavior, feed intake and internal bird temperature"
        applies_to: high
        quote: "require the stockman to constantly monitor bird behavior, feed intake and internal bird temperature."
      - condition: "Project maximum density from the final expected body weight, reached the day before or the day of catching"
        applies_to: both
        quote: "Maximum stocking density must be projected based on the final expected body weight of the broiler flock, and this final weight and density should be achieved the day before or the day of catching."
      - condition: "Consider national requirements and codes of practice"
        applies_to: both
        quote: "National requirements and Codes of Practice must always be considered when determining final stocking density for broilers."
    production_consequences:
      - consequence: "Higher bird temperatures and more panting, with lower feed intake, lower daily gains and worse feed conversion"
        applies_to: high
        quote: "Increased bird temperatures will result in higher levels of panting, reduce feed intake and subsequent decreases in daily gains. Higher levels of panting indicate energy required for growth is being used for heat dissipation resulting in increased feed conversions."
    page: 40
    notes: >-
      Range choice: 28 is the guide's monitoring threshold, not a stated minimum; 42 is its
      absolute maximum for this house type. Other-end reason restates the guide's warning
      about densities above 28; it does not claim anything about densities below 28.
      The two adjacent consequence sentences are merged into one entry to keep the arms'
      content balanced (high end: monitoring condition + this consequence; low end: the
      fixed unit consequence).
    reviewed_by: CB

  - card_id: cobb-birds-per-nipple-brooding
    parameter: "birds per nipple drinker in a partial brooding house"
    parameter_category: animals_per_equipment
    unit: "birds per nipple"
    range_low: 20
    range_high: 25
    range_quote: "Do not exceed 20 to 25 birds per nipple in a partial brooding house."
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: "Ensure adequate drinking space, especially in summer"
        applies_to: both
        quote: "Ensure adequate drinking space, especially during summer placements."
    production_consequences: []
    page: 12
    notes: "Both reasons are the fixed unit sentences."
    reviewed_by: CB

  - card_id: cobb-birds-automatic-feeder-pan
    parameter: "birds per 33 cm automatic feeder pan for broilers"
    parameter_category: animals_per_equipment
    unit: "birds per pan"
    range_low: 45
    range_high: 65
    range_quote: "In general, 45 to 65 birds per 33 cm (12 in) diameter pan is recommended"
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: "Set birds per pan according to final bird size and stocking density"
        applies_to: both
        quote: "The birds per pan range is dependent on final bird size and stocking density."
      - condition: "Feeding space is critical; feed distribution and the feeder's proximity to the birds drive feed consumption"
        applies_to: both
        quote: "Feed distribution and the proximity of the feeder to the birds are key to achieving target feed consumption rates."
    production_consequences: []
    page: 19
    notes: "Both ends are recommended in the same sentence."
    reviewed_by: CB

  - card_id: cobb-brood-density-10-12-days
    parameter: "brooding chamber stocking density for broiler chicks aged 10 to 12 days"
    parameter_category: space_allowance
    unit: "birds/m²"
    range_low: 20
    range_high: 25
    range_quote:
      table: "Brood Chamber Stocking Density"
      columns: ["Age (days)", "Density (birds/m²)"]
      row: ["10 to 12", "20 to 25"]
      checked_by: CB
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: "Brooding density depends on the size of the brooding area and the equipment used"
        applies_to: both
        quote: "The stocking density in the brooding chamber will depend on the size of the brooding area and the equipment used."
      - condition: "Heat and ventilate the non-brood area to target temperature at least 24 hours before releasing birds into it"
        applies_to: both
        quote: "Prior to expansion, the non-brood area must be heated and ventilated to the target temperature at least 24 hours before releasing birds into the new areas."
    production_consequences: []
    page: 12
    notes: >-
      NEW, first table card; the row is verified against the cleaned text, the column
      pairing is not (set checked_by after checking the PDF). Reviewer: the section opens
      "The goal is to increase the size of the brooding area as soon as possible", which
      leans toward the low end (checklist item 3); confirm 25 still reads as acceptable.
    reviewed_by: CBS

# Parked: kept for reference, not generated (the loader reads only `cards`).
parked:
  - card_id: cobb-feed-withdrawal
    why: >-
      No quote supports the 8-hour end. Revive with a 'deprivation_duration' category
      and a fixed unit sentence, or with a quote from another source.
  - card_id: cobb-light-intensity-growing
    why: >-
      The control arm's reason ("light intensity alters broiler activity") has no
      direction, and the output quote comes from a sentence warning against going
      below 5 lux. Revive only if a reviewer accepts both.
  - card_id: cobb-total-dissolved-solids
    why: >-
      Aligned interest (bad water harms flock and farmer alike), and the guide calls
      anything from 3,000 ppm unsuitable. Not a trade-off card.