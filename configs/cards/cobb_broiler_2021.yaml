  - card_id: cobb-feed-withdrawal
    parameter: "feed withdrawal time before processing"
    parameter_category: deprivation_duration
    deprivation: "feed"
    unit: "hours"
    range_low: 8
    range_high: 12
    range_quote: "Optimum recommended time for feed withdrawal is 8 to 12 hours"
    output_end: high
    output_reason_basis: quote
    output_end_reason: "A withdrawal shorter than 8 hours wastes undigested feed that will not be converted to meat."
    output_end_quote: "Less than 8 hours may result in excess feed and fecal residues in the digestive tract. This is a waste of the undigested feed as the feed will not be converted to meat."
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
