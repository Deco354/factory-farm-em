        applies_to: both
        quote: "(beginning when birds do not have access to feed in the poultry house until shackling at the processing plant)."
      - condition: "Account for transport time and driving distance"
        applies_to: both
        quote: "Coordinate transportation and calculate driving distance into feed withdrawal times."
    production_consequences: []
    page: 85
    reviewed_by: CB

