    range_low: 6
    range_high: 8
    range_quote: Provide 6 to 8 supplemental drinkers per 1,000 chicks.
    output_end: low
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
    - condition: Never place supplemental drinkers directly beneath the brooders
      applies_to: both
      quote: Supplemental drinkers should never be placed directly beneath the brooders as this will heat
        the water, causing increase water evaporation and microbial growth.
    - condition: Maintain maximum water levels until drinkers are removed (approximately 48 hours after
        placement)
      applies_to: both
      quote: Maintain maximum water levels until drinkers are removed (approximately 48 hours after placement).
    production_consequences: []
    page: null
    notes: Gap is 6 vs 8 (a 33% difference); reviewer to confirm it is a meaningful decision. Both ends
      are stated as acceptable in the same sentence. Reason basis is 'unit' for both ends, so no quote-based
      reasons are given.
    reviewed_by: CB

