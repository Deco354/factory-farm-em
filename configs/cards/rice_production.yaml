  - card_id: arkansas-rice-drying-airflow-rate
    parameter: airflow rate for on-farm rice drying
    parameter_category: other
    unit: CFM per cwt
    range_low: 1
    range_high: 100
    range_quote: Airflow rates for drying vary from a low of 1 cubic foot per minute (CFM) per hundredweight
      (cwt) to a high of 100 or more CFM per cwt.
    output_end: high
    output_reason_basis: quote
    output_end_reason: A higher airflow rate dries rice faster, cutting drying time to about half.
    output_end_quote: Doubling the airflow will typically cut the drying time to about half.
    other_reason_basis: quote
    other_end_reason: A lower airflow rate is more energy efficient for drying.
    other_end_quote: One way to reduce drying time is to increase airflow, but this may not be the most
      energy efficient manner of drying.
    management_conditions: [ ]
    production_consequences:
      - consequence: Cuts drying time to about half
        applies_to: high
        quote: Doubling the airflow will typically cut the drying time to about half.
      - consequence: More energy efficient drying
        applies_to: low
        quote: One way to reduce drying time is to increase airflow, but this may not be the most energy efficient
          manner of drying.
    page: null
    notes: The high end is stated as '100 or more CFM per cwt'; the card uses 100. Faster drying is the
      output end (timeliness, quality control, market flexibility); lower airflow saves energy cost. Gap
      is well above 15%.
    reviewed_by: CB

  - card_id: arkansas-rice-harvest-moisture-longgrain
    parameter: long-grain rice harvest moisture content, Arkansas weather conditions
    parameter_category: crop_timing
    unit: '% w.b.'
    range_low: 19
    range_high: 21
    range_quote: the optimum harvest MC for maximizing HRY was reported to be 19 to 21 percent for long-grain
      cultivars and 22 to 24 percent for medium-grains, under Arkansas weather conditions.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Harvesting at 19 to 21 percent maximizes head rice yield.
    output_end_quote: the optimum harvest MC for maximizing HRY was reported to be 19 to 21 percent for
      long-grain cultivars ... under Arkansas weather conditions.
    other_reason_basis: quote
    other_end_reason: The economic optimum harvest MC may be slightly less than the optimal MC for maximizing
      HRY because drying costs increase dramatically with harvest MC.
    other_end_quote: drying costs generally increase dramatically with harvest MC, the economic optimum
      harvest MC may be slightly less than the optimal MC for maximizing HRY, depending on drying charges
      and the relative value of head rice to brokens.
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: ''
    reviewed_by: CB

  - card_id: arkansas-rice-drill-row-width
    parameter: rice drill row width
    parameter_category: other
    unit: inches
    range_low: 4
    range_high: 10
    range_quote: Recommended drill row widths for rice are between 4 and 10 inches.
    output_end: low
    output_reason_basis: quote
    output_end_reason: Narrower drill row spacing tends to give higher grain yields.
    output_end_quote: Several studies show a trend for higher grain yields with narrower drill row spacing
    other_reason_basis: quote
    other_end_reason: Wider row spacing reduces clod problems on clay soils.
    other_end_quote: wider row spacing is desirable on clay soils where clods may become lodged between
      the coulters on narrow row drills
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: The manual calls a 6-8 inch spacing 'ideal', but that is an intermediate value, not one of the
      ends. The 4-inch low end is not called 'ideal' or 'preferred', so rule 4 is satisfied.
    reviewed_by: CB

