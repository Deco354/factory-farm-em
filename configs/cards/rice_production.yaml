cards:
  - card_id: arkansas-rice-hybrid-seeding-rate
    parameter: hybrid rice seeding rate (for drill-seeded conditions)
    parameter_category: seeding_rate
    unit: seeds per square foot
    range_low: 10
    range_high: 15
    range_quote: For hybrids, 10 to 15 seeds per square foot is needed to obtain optimum stand density of
      6 to 10 plants per square foot (or 4 to 6 seedlings per 7.5- inch drill row foot).
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: Only range found in excerpt. High end (15 seeds/sq ft) likely gives denser stand, low end saves
      seed. No explicit yield reason given; using unit basis. Range applies to hybrids only.
    reviewed_by: CB

  - card_id: arkansas-rice-elemental-s-acidification
    parameter: elemental sulfur rate for soil acidification to correct zinc deficiency
    parameter_category: input_rate
    unit: pounds per acre
    range_low: 500
    range_high: 1000
    range_quote: Acidification of the soil requires the addition of elemental S at 500 to 1,000 pounds per
      acre (Table 9-14) but is not likely economical.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Reduction of soil pH corrects zinc deficiency.
    output_end_quote: Correction of Zn deficiency requires reduction of soil pH and/or the addition of a
      suitable Zn source.
    other_reason_basis: quote
    other_end_reason: The practice is not economical, so lower rates reduce cost.
    other_end_quote: but is not likely economical
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: 'The low-end reason is inferred from the manual''s statement that acidification is ''not likely
      economical.'' The manual does not explicitly state that lower rates save money, but the cost concern
      is implicit. Rule 4 is borderline: ''not likely economical'' refers to the whole practice, not specifically
      the high end.'
    reviewed_by: CB

