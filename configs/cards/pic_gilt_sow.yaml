  - card_id: pic-lactation-length-batch-flow
    why: >-
      Candidate, not checked against the PDF. Real trade-off: 19-20 day lactation (4-week
      flow) gives 13 farrowing space turns a year vs 9 for 26-27 days (3-week flow); longer
      lactations give heavier piglets and better next-cycle sow performance. Blocked by
      drafter rule 6: the same manual says "avoid weaning individual piglets before 18
      days of lactation, with a minimum average of 21-23 days", so the 19-20 day output
      end is below PIC's own recommended average. Usable only if you decide the flow
      table counts as PIC endorsing 19-20 days.
    parameter: "lactation length set by the batch farrowing flow (4-week vs 3-week flow)"
    parameter_category: procedure_timing
    unit: days
    range_low: 20
    range_high: 26
    output_end: low
    output_end_quote: "Table 6.2 row: Annual farrowing space turns per year 13 9 13 10"
    other_end_quote: "It is generally accepted that longer lactations tend to produce a heavier piglet at weaning and a better reproductive performance in the sow’s subsequent cycle."
