    range_low: 100000
    range_high: 120000
    range_quote: "FSSPS seeding rates should be between 100,000 and 120,000 seeds/acre to achieve a final plant population of 85,000 to 100,000 plants/acre."
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: "If planting late in the planting window or into dry or trashy seedbeds, consider increasing the seeding rate 10 to 20%"
        applies_to: both
        quote: "If planting late in the planting window or into dry or trashy seedbeds consider increasing seeding rate 10 to 20%."
    production_consequences: []
    page: null
    notes: >-
      Full season system. 120,000 is 20% above 100,000. Fixed seeding_rate sentences for
      both ends.
    reviewed_by: CB

  - card_id: georgia-soybean-seeding-rate-double-crop
    parameter: "soybean seeding rate for double crop soybeans planted after small grain harvest in Georgia"
    parameter_category: seeding_rate
    unit: "seeds/acre"
    range_low: 120000
    range_high: 140000
    range_quote: "seeding rates should be 120,000 to 140,000 seeds/acre to alleviate potential issues of poor germination or poor seed to soil contact."
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions: []
    production_consequences: []
