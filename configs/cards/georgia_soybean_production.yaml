# Parameter cards: Georgia Soybean Production Guide
# Crop control arm (mode: crop). Every quote must match the cleaned book text.
# Check with:
#   uv run python -m fragile_compassion.sft_document_generation.cards configs/cards/georgia_soybean_production.yaml
#
# Crop cards follow configs/prompts/card_drafter_crop.md: both ends acceptable, a trade-off
# inside the farm business, no harm at either end, and a quoted reason for each end (only
# seeding_rate cards may use the fixed unit sentences instead).

source:
  title: "Georgia Soybean Production Guide"
  edition: "2023"
  domain: crop_agronomy
  mode: crop
  jurisdiction: US
  book_text: "context/cleaned/Georgia Soybean Production Guide_cleaned.txt"

cards:
  - card_id: georgia-soybean-row-spacing-30-36
    parameter: soybean row spacing in Georgia
    parameter_category: other           # row width: seeding_rate is now per-area rates only
    unit: inches
    range_low: 30
    range_high: 36
    range_quote: However, most soybean varieties will give near top yield with row space ranging 30 to 36
      inches, if planting occurs at the proper time.
    output_end: low
    output_reason_basis: quote
    output_end_reason: Narrower rows increase yield; Georgia research shows a 0.7% yield benefit for every
      inch the row is narrowed relative to 36-inch rows.
    output_end_quote: Georgia research has demonstrated a yield benefit of 0.7% for every inch the row is
      narrowed, relative to 36-inch rows.
    other_reason_basis: quote
    other_end_reason: Changing row width requires significant investments in new equipment and changes to
      existing operations.
    other_end_quote: However, changing row width requires significant investments in new equipment and changes
      to existing operations.
    management_conditions:
      - condition: Use proper maturity group and planting date; their absence may negate narrow-row benefits.
        applies_to: low
        quote: Note the absence of in-row subsoiling and proper maturity group and planting date decisions
          may negate any potential benefits of narrow rows.
      - condition: Plant at the proper time for 30-36 inch rows to achieve near top yield.
        applies_to: high
        quote: if planting occurs at the proper time
    production_consequences:
      - consequence: Narrower rows increase yield relative to 36-inch rows.
        applies_to: low
        quote: Georgia research has demonstrated a yield benefit of 0.7% for every inch the row is narrowed,
          relative to 36-inch rows.
      - consequence: Most varieties give near top yield at 30-36 inch row spacing when planted at the proper
          time.
        applies_to: high
        quote: However, most soybean varieties will give near top yield with row space ranging 30 to 36 inches,
          if planting occurs at the proper time.
    page: null
    notes: The 30-36 inch range is explicitly stated as near top yield if planted at the proper time; 30
      is the narrower, higher-yield end and 36 avoids row-width change investment. The high end is 20% above
      the low end.
    reviewed_by: CB

