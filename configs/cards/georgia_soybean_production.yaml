    reviewed_by: CB

  - card_id: georgia-soybean-seeding-rate-increase-conservation-tillage
    parameter: "increase in soybean seeding rate over the conventional rate in a conservation tillage system in Georgia"
    parameter_category: seeding_rate
    unit: "percent increase in seeding rate"
    range_low: 10
    range_high: 15
    range_quote: "Soybean seeding rates should be increased 10 to 15 percent in conservation tillage soybean systems to help offset this issue."
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions: []
    production_consequences: []
    page: null
    notes: >-
      From soybean-02. The draft's output reason was the range sentence itself, which
      applies to both ends, so both ends now use the fixed sentences. The value is a
      relative increase, so replies will say e.g. 'a 15 percent increase'; reviewer to
      confirm that reads naturally.
    reviewed_by: CB

  - card_id: georgia-soybean-harvest-moisture
    parameter: soybean harvest moisture content
    parameter_category: crop_timing
    unit: percent moisture content
    range_low: 14
    range_high: 16
    range_quote: High moisture grain loses this moisture rapidly in the field; thus, for maximum returns
      soybeans should be harvested when they have reached approximately 14 to 16 percent moisture content.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Harvesting at the higher moisture end allows earlier harvest, avoiding field losses.
    output_end_quote: Drying permits harvesting the grain as soon as it is ripe and mature to avoid field
      losses
    other_reason_basis: quote
    other_end_reason: Harvesting at the lower moisture end reduces the amount of water that must be removed,
      lowering drying cost.
    other_end_quote: a large amount of water must be removed increasing the cost of the drying operation
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: Gap is 14.3% (16/14), just under the 15% threshold. The manual does not explicitly attach reasons
      to the 14% and 16% ends; the reasons are inferred from adjacent sentences about avoiding field losses
      and drying cost.
    reviewed_by: CB

# Parked: kept for reference, not generated (the loader reads only `cards`).
parked:
  - card_id: georgia-soybean-irrigation-stand-establishment
    why: >-
      Neither reason is about the 1 vs 1.5 inch pre-plant amount: 'once the soybean plant
      wilts' concerns irrigation timing, and 'maintaining profitability at much lower market
      prices' describes the whole Table 5 schedule. The table row also has no checked_by, and
      `page: CB` looks like a slipped reviewed_by.
    parameter: soybean irrigation amount at stand establishment
    parameter_category: input_rate
    unit: inches
    range_low: 1
    range_high: 1.5
    range_quote:
      table: 'Table 5. The following water balance method is suggested for 45 to 50 bushel soybean yields:'
      columns:
        - Growth Stage
        - Trigger
        - Amount
      row:
        - Stand Establishment
        - Irrigate prior to planting
        - 1-1.5”
      checked_by: null
    output_end: high
    output_reason_basis: quote
    output_end_reason: Higher water application prevents wilting and preserves yield potential.
    output_end_quote: once the soybean plant wilts, yield potential will be lost
    other_reason_basis: quote
    other_end_reason: Lower water application reduces cost and maintains profitability.
    other_end_quote: maintaining profitability at much lower market prices
    management_conditions:
      - condition: Irrigate prior to planting
        applies_to: both
        quote: Irrigate prior to planting
    production_consequences:
      - consequence: Risk of wilting and yield loss
        applies_to: low
        quote: once the soybean plant wilts, yield potential will be lost
      - consequence: Over-irrigation and water waste
        applies_to: high
        quote: The checkbook method is very conservative and most often errors on the side of over irrigating
          rather than under irrigating.
    page: null
    reviewed_by: CB

  - card_id: georgia-soybean-harvest-moisture
    why: >-
      14 vs 16 percent is a 14 percent gap, and neither reason is about this range:
      'harvested promptly ... to reduce field losses' leads into harvesting as high as 20
      percent, and the drying-cost sentence is about drying from 20 percent. The guide
      presents 14-16 as one target 'for maximum returns'. The drafter also rejected it in
      the same run.
    parameter: soybean harvest moisture content
    parameter_category: crop_timing
    unit: percent moisture content
    range_low: 14
    range_high: 16
    range_quote: High moisture grain loses this moisture rapidly in the field; thus, for maximum returns
      soybeans should be harvested when they have reached approximately 14 to 16 percent moisture content.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Harvesting promptly when mature reduces field losses and weather damage.
    output_end_quote: Soybeans should be harvested promptly when they are mature to reduce field losses
      and lessen chances of damage from bad weather.
    other_reason_basis: quote
    other_end_reason: Removing a large amount of water increases the cost of the drying operation.
    other_end_quote: However, when drying from 20 percent to a safe moisture content, a large amount of
      water must be removed increasing the cost of the drying operation.
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: The high end (16%) is about 14% above the low end (14%), below the 15% meaningful-gap threshold.
      Output end is high because harvesting at higher moisture means earlier harvest and less field loss;
      low end saves drying cost.
    reviewed_by: null

  - card_id: georgia-soybean-irrigation-r1-r4
    why: >-
      Neither reason is about 1.0 vs 1.5 inches per application: the wilting sentence is
      about when to irrigate (reproductive vs vegetative growth), and 'the checkbook method
      ... errors on the side of over irrigating' is about the scheduling method. The card's
      notes say the low-end reason is inferred.
    parameter: soybean irrigation amount per application at R1–R4 (first bloom to beginning pod elongation)
    parameter_category: input_rate
    unit: ”
    range_low: 1
    range_high: 1.5
    range_quote:
      table: 'Table 5. The following water balance method is suggested for 45 to 50 bushel soybean yields:'
      columns:
        - Growth Stage
        - Trigger
        - Amount
      row:
        - 1 st Bloom – Beginning Pod Elongation (R1 – R4)
        - Wilting by mid-day
        - 1.0-1.5”
      checked_by: null
    output_end: high
    output_reason_basis: quote
    output_end_reason: Preventing wilting during reproductive growth protects yield potential.
    output_end_quote: Specifically, when wilting occurs during reproductive growth the chance for lost yield
      potential is greater than if it occurs during vegetative growth.
    other_reason_basis: quote
    other_end_reason: The lower end uses less water and avoids the over-irrigation that the checkbook method
      tends toward.
    other_end_quote: The checkbook method is very conservative and most often errors on the side of over
      irrigating rather than under irrigating.
    management_conditions:
      - condition: Irrigate when plants are wilting by mid-day
        applies_to: both
        quote: Wilting by mid-day
    production_consequences: [ ]
    page: null
    notes: The lower-end reason is inferred from the manual's caution that the checkbook method tends to
      over-irrigate; the manual does not explicitly say 1.0 inches is preferred. The row label in the excerpt
      is split across lines.
    reviewed_by: null
