    unit: "seeds/acre"
    range_low: 120000
    range_high: 140000
    range_quote: "ESPS seeding rates should be around 120,000 to 140,000 seeds/acre to achieve maximum yields."
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions: []
    production_consequences: []
    page: null
    notes: >-
      Early system, planted into cooler soils. 140,000 is 17% above 120,000. Fixed
      seeding_rate sentences for both ends. The drafter rejected this under rule 3 because
      the guide gives no reason for either end; that is exactly what the unit sentences now
      cover.
    reviewed_by: CB

