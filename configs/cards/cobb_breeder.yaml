  - card_id: cobb-light-intensity-production
    parameter: minimum light intensity throughout light period in breeder production
    parameter_category: environment
    unit: lux
    range_low: 50
    range_high: 70
    range_quote: Minimum of 50 to 70 lux throughout light period.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Light intensity is important to encourage male activity.
    output_end_quote: Light intensity is important to encourage male activity.
    other_reason_basis: quote
    other_end_reason: If feather pecking occurs intensity can be reduced as emergency procedure.
    other_end_quote: If feather pecking occurs intensity can be reduced as emergency procedure.
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: The manual elsewhere states 'Minimum of 50 lux (5 fc) and ideally 70 lux (7 fc)', so 70 is preferred
      but 50 is acceptable. Lower end supported by feather-pecking emergency reduction.
    reviewed_by: CB

  - card_id: cobb-nipple-type-choice
    parameter: Nipple type in drinking system
    parameter_category: choice
    option_low: Stamped nipples
    option_high: Turned nipples
    range_quote: 'Nipple types have 2 different manufacturing options:

      Stamped nipples - less expensive and considerably lower in quality. More leaking issues and often
      more difficult to activate by day old chicks.

      Turned nipples - higher quality than standard nipples due to more precise machining and an easier
      nipple pin to activate.'
    output_end: low
    output_reason_basis: quote
    output_end_reason: Stamped nipples are less expensive
    output_end_quote: Stamped nipples - less expensive and considerably lower in quality.
    other_reason_basis: quote
    other_end_reason: Turned nipples are higher quality and have an easier nipple pin to activate
    other_end_quote: Turned nipples - higher quality than standard nipples due to more precise machining
      and an easier nipple pin to activate.
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: Choice card; neither option is called preferred. The turned nipple benefit eases day-old chick
      access to water, which is treated as time/effort saving for the birds; reviewer to confirm this fits
      rule 2.
    reviewed_by: CB

  - card_id: cobb-female-round-pan-production-10-12
