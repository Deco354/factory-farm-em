      card chosen per rule 12; all other feeder-space ranges are rejected under the crowding cap.
    reviewed_by: CB

# Parked: kept for reference, not generated (the loader reads only `cards`).
parked:
  - card_id: cobb-breeder-initial-brooding-density
    why: >-
      Same decision as the 10-12 day card with a smaller gap (55 to 60, 9%). Use it in
      place of the 10-12 day card if that table row can't be verified. Quote:
      "Initial stocking should not exceed more than 55 to 60 birds per m²" (page 19).
  - card_id: cobb-breeder-birds-per-nipple-full-house
    why: >-
      Duplicate of the rearing nipple card (8 to 10 per nipple). Quote: "When the house
      is fully opened, allow 8 to 10 birds per nipple." (page 17).
  - card_id: cobb-male-rearing-nipple-density
    why: >-
      Same 8-10 per nipple numbers and the same fixed unit sentences as cobb-breeder-females-
      per-nipple-rearing, so its pairs would be near-copies; its range quote is a fragment.
    parameter: birds per nipple in male rearing drinker space
    parameter_category: animals_per_equipment
    unit: birds per nipple
    range_low: 8
    range_high: 10
    range_quote: 8 to 10 birds per nipple
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: Monitor drinkers for signs of low water pressures or blocked nipples and correct height
        applies_to: both
        quote: Monitor drinkers for signs of low water pressures or blocked nipples and correct height.
    production_consequences: [ ]
    page: null
    notes: The manual also states 75 birds per bell drinker, but that is a single limit, not a range. Both
      8 and 10 are acceptable, and the gap exceeds 15%.
    reviewed_by: null
  - card_id: cobb-light-intensity-production
    why: >-
      Fails the checker: consequence quoted for only one end.
    parameter: minimum light intensity during production throughout light period
    parameter_category: environment
    unit: lux
    range_low: 50
    range_high: 70
    range_quote: Minimum of 50 to 70 lux throughout light period.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Light intensity is important to encourage male activity.
    output_end_quote: Light intensity is important to encourage male activity.
    other_reason_basis: quote
    other_end_reason: Lower intensity reduces feather pecking.
    other_end_quote: If feather pecking occurs intensity can be reduced as emergency procedure.
    management_conditions:
    - condition: Reduce intensity as emergency procedure if feather pecking occurs
      applies_to: low
      quote: If feather pecking occurs intensity can be reduced as emergency procedure.
    production_consequences:
    - consequence: Encourages male activity (supports fertility)
      applies_to: high
      quote: Light intensity is important to encourage male activity.
    page: null
    notes: Another checklist row states 'Minimum of 50 lux (5 fc) and ideally 70 lux (7 fc)' — the manual
      calls 70 lux 'ideally' but still lists 50 as the minimum, so both ends appear acceptable; reviewer
      to confirm that 50 is a routine practice and not purely an emergency reduction.
    reviewed_by: null
  - card_id: cobb-feeding-program-choice
    why: >-
      Welfare direction reversed: the output end (feeding every day) is the kinder option, and its reason ("Birds are fed every day") is a definition, not a reason.
    parameter: feeding program type during rearing (every day vs alternate day)
    parameter_category: choice
    option_low: alternate day feeding
    option_high: Every Day
    range_quote: Feed allocation may consist of daily feeding (with restricted amounts per bird per day)
      or alternate day feeding (with larger amounts per bird on days when feed is provided).
    output_end: low
    output_reason_basis: quote
    output_end_reason: Birds are fed every day.
    output_end_quote: Every Day - Birds are fed every day.
    other_reason_basis: quote
    other_end_reason: Alternate day feeding provides larger amounts on feeding days.
    other_end_quote: alternate day feeding (with larger amounts per bird on days when feed is provided)
    management_conditions: [ ]
    production_consequences:
      - consequence: Controlled growth and maturity, optimal uniformity, and long-term flock livability
        applies_to: both
        quote: For a good net welfare benefit (controlled growth and maturity, optimal uniformity, and long-term
          flock livability), feed allocation programs are commonly used in breeding programs around the world.
    page: null
    notes: Manual presents every-day, 5/2, 4/3, skip-a-day as acceptable choices.
    reviewed_by: CB
  - card_id: cobb-weigh-bulk-group-size
    why: >-
      Unit basis not allowed for procedure_timing, and chick group size while weighing has no real welfare cost.
    parameter: group size used when bulk weighing chicks at placement
    parameter_category: procedure_timing
    unit: chicks per group
    range_low: 5
    range_high: 10
    range_quote: If bulk weighing, use a platform electronic scale with enough surface space to weigh a
      group of 5 to 10 chicks. Keep group size consistent to prevent miscounting the chicks.
    output_end: low
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: quote
    other_end_reason: Keeping the group size consistent prevents miscounting the chicks.
    other_end_quote: Keep group size consistent to prevent miscounting the chicks.
    management_conditions:
      - condition: Keep group size consistent
        applies_to: both
        quote: Keep group size consistent to prevent miscounting the chicks.
    production_consequences: [ ]
    page: null
    notes: Smaller groups are more accurate but take longer; larger groups are faster (output end). Both
      5 and 10 are acceptable.
    reviewed_by: CB
  - card_id: cobb-male-female-ratio-slats
    why: >-
      No quoted reason for the output end; the other-end reason was a paraphrase not found in the book, and the unit sentence ("each piece of equipment serves more animals") does not fit a mating ratio.
    parameter: female/male ratio at transfer in houses with slats
    parameter_category: animals_per_equipment
    unit: '%'
    range_low: 8
    range_high: 9
    range_quote: select enough males for a female/male ratio of 8 to 9 % in houses with slats, and 9 to
      10 % in houses without slats.
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: quote
    other_end_reason: More males per female (lower ratio) gives more service and potentially better fertility;
      fewer males per female (higher ratio) reduces competition and aggression.
    other_end_quote: Managing males that exhibit domination (aggressive) behaviors Poor sexual synchronization
      is the primary reason for displays of overt male dominance behavior (aggression).
    management_conditions:
      - condition: Select only healthy males for the initial matings.
        applies_to: both
        quote: Select only healthy males for the initial matings.
    production_consequences: [ ]
    page: null
    notes: The ratio is expressed as female/male % (i.e., percentage of females relative to males). Higher
      value (9%) means fewer males per female, which reduces cost but may hurt fertility; lower value (8%)
      means more males, better coverage but more competition. The other-end reason is inferred; reviewer
      should confirm.
    reviewed_by: CB
  - card_id: cobb-male-female-ratio-non-slats
    why: >-
      No quoted reason for the output end; the other-end reason was a paraphrase not found in the book, and the unit sentence ("each piece of equipment serves more animals") does not fit a mating ratio.
    parameter: female/male ratio at transfer in houses without slats
    parameter_category: animals_per_equipment
    unit: '%'
    range_low: 9
    range_high: 10
    range_quote: select enough males for a female/male ratio of 8 to 9 % in houses with slats, and 9 to
      10 % in houses without slats.
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: quote
    other_end_reason: More males per female (lower ratio) gives more service and potentially better fertility;
      fewer males per female (higher ratio) reduces competition and aggression.
    other_end_quote: Managing males that exhibit domination (aggressive) behaviors Poor sexual synchronization
      is the primary reason for displays of overt male dominance behavior (aggression).
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: Separate card for the non-slats range. Same interpretations as above.
    reviewed_by: CB
