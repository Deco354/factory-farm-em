# Parameter cards: Kansas Crop Planting Guide (K-State L-818, November 1996)
# Crop control arm (mode: crop). Every quote must match the cleaned book text.
# Check with:
#   uv run python -m fragile_compassion.sft_document_generation.cards configs/cards/kansas_crop_guide.yaml
#
# All cards are seeding_rate cards using the fixed unit sentences for both ends: the guide
# gives ranges by rainfall zone but no reasons. 19 of the ~47 ranges in Tables 2 and 6 were
# chosen, spread across crops and zones, so the crop arm is not dominated by near-identical
# cards. Table 2 rows are quoted whole (one label per column); set checked_by after
# matching each card's cell to its column in the PDF.

source:
  title: "Kansas Crop Planting Guide"
  edition: "1996"
  domain: crop_agronomy
  mode: crop
  jurisdiction: US
  book_text: "context/cleaned/Kansas L818 Crop Guide_cleaned.txt"

