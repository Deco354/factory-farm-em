    range_quote:
      table: Table 1 Recommended drinking space requirements during brooding.
      columns:
        - Type of Drinker
        - Drinker Space
      row:
        - Mini-drinkers or tray
        - 12 mini-drinkers per 1000 chicks; 9-10 chicks per mini-drinker or tray
      checked_by: CB
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: Gap is 11% (10 vs 9), less than 15%.
    reviewed_by: CB

  - card_id: ross-stocking-density-rear-females
    parameter: stocking density during rear (10-105 days) for females
    parameter_category: space_allowance
    unit: birds/m2
    range_low: 4
    range_high: 8
    range_quote:
      - Rearing 10-105 days (2-15 weeks)
      - table: Table 7
        columns:
          - Males (Birds/m2 [ft2/bird])
          - Females (Birds/m2 [ft2/bird])
        row:
          - 3-4 (2.7-3.6)
          - 4-8 (1.4-2.7)
        checked_by: CB
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: If stocking density is increased, ventilation settings and feeder and drinker space must
          also be increased appropriately
        applies_to: high
        quote: If stocking density is increased, then ventilation settings and feeder and drinker space must
          also be increased appropriately.
      - condition: If environment or housing conditions are not optimal, reduce stocking density
        applies_to: low
        quote: If the environment and/or housing conditions experienced by the bird are not optimal, reduce
          stocking density.
    production_consequences:
      - consequence: Higher stocking density increases biological output
        applies_to: high
        quote: Stocking density, in part, determines the biological output of the flock.
      - consequence: Lower densities suit tropical climates, higher densities suit temperate climates
        applies_to: both
        quote: The range of figures quoted represents the variation in conditions from tropical (lower densities)
          to temperate (higher densities) climates
    page: null
    notes: Females range 4-8 birds/m2; males range 3-4 birds/m2 rejected as crowding cap. Both ends acceptable
      per manual; lower density gives more space per bird, higher density gives more output.
    reviewed_by: CB

  - card_id: ross-stocking-density-male-rearing
    parameter: stocking density for male parent stock during rearing (0-140 days / 0-20 weeks)
    parameter_category: space_allowance
    unit: birds/m2
    range_low: 3
    range_high: 4
    range_quote:
      table: Stocking Density (birds/m2 [ft2/bird])
      columns:
        - Rearing 0-140 Days (0-20 Weeks)
        - Production 140-Depletion (20-Depletion)
      row:
        - 3-4 (2.7-3.6)
        - 3.5-5.5 (2.0-3.1)
      checked_by: CB
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: Range from the first cell of the stocking density table (male, rearing). Both ends are acceptable
      as given. No additional conditions or consequences provided in the excerpt. This is the only space_allowance
      card proposed per rule 12.
    reviewed_by: CB

  - card_id: ross-heating-direct-indirect
    parameter: heating system type for the poultry house
    parameter_category: choice
    option_low: direct-fired heaters
    option_high: indirect heaters
    range_quote:
      - Heating systems can be separated into direct and indirect heater types.
      - Indirect heaters flow heated air through a chamber known as a heat exchanger.
      - Regardless of which heating system is used, it is important to have a good distribution of heat throughout
        the bird area of the house.
    output_end: low
    output_reason_basis: quote
    output_end_reason: Direct-fired heaters are a very efficient way to heat cold air.
    output_end_quote: Although this is a very efficient way to heat cold air
    other_reason_basis: quote
    other_end_reason: Indirect heaters vent house air, moisture, CO2 and CO outside via a chimney or duct,
      keeping them out of the house environment.
    other_end_quote: The house air, moisture, CO2, and CO are vented outside via a chimney or duct.
    management_conditions:
      - condition: When pre-heating or heating a house with direct-fired heaters, run a minimum ventilation
          rate to exchange the air and prevent the build-up of harmful products in the house.
        applies_to: low
        quote: When pre-heating or heating a house with direct-fired heaters, running a minimum ventilation
          rate to exchange the air and prevent the build-up of harmful products in the house is essential.
    production_consequences: [ ]
    page: null
    notes: Both heater types are presented as acceptable ('Regardless of which heating system is used').
      Direct-fired is the output end (efficiency); indirect is the animal end (no CO2/CO/moisture added
      to house air). The manual also notes radiant (direct-fired) heaters are useful in brooding, but that
      does not overturn the trade-off.
    reviewed_by: CB

  - card_id: ross-nipples-20wk-depletion
    parameter: birds per nipple from 20 weeks of age to depletion
    parameter_category: animals_per_equipment
    unit: birds/nipple
    range_low: 6
    range_high: 10
    range_quote:
      - Recommended feeder and drinker space from 15 weeks of age to depletion.
      - table: Table 15
        columns:
          - Bell cm (in), 20 weeks to depletion
          - Nipple
          - Cup
        row:
          - 2.5 (1.0)
          - 6-10 birds/nipple
          - 15-20 birds/cup
        checked_by: CB
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: Ensure increases in available floor space and feeding and drinking spaces are given at
          the recommended ages.
        applies_to: both
        quote: Ensure increases in available floor space and feeding and drinking spaces are given at the
          recommended ages.
    production_consequences: [ ]
    page: null
    notes: Both male and female rows give 6-10 birds/nipple at 20 weeks to depletion. Higher number means
      fewer nipples needed (lower cost); lower number gives each bird more access. Reviewer to confirm the
      table cell mapping.
    reviewed_by: CB
  - card_id: ross-ps-feed-form-mash-crumble
    parameter: Feed form for breeding stock (mash vs crumble)
    parameter_category: choice
    option_low: mash
    option_high: crumble
    range_quote: Breeding stock can be fed successfully on mash, crumbled or pelleted feed, as long as good
      feeding management is practiced.
    output_end: high
    output_reason_basis: quote
    output_end_reason: Crumble supports optimal clean-up time, ensures uniform distribution, and offers
      lower chance of particle segregation compared to mash.
    output_end_quote: A good-quality crumble will support optimal clean-up time compared to mash, ensuring
      uniform distribution, and offers a lower chance for particle segregation of the dietary ingredients
      compared to mash.
    other_reason_basis: quote
    other_end_reason: Mash extends clean-up time, allowing all birds to eat the recommended feed amount.
    other_end_quote: A good-quality mash extends clean-up time compared to crumble or pellet forms, and
      therefore allows all birds the opportunity to eat the recommended feed amount.
    management_conditions: []
    production_consequences:
      - consequence: Supports good body-weight development and uniformity.
        applies_to: low
        quote: This will support good body-weight development and uniformity.
      - consequence: Feed intake is achieved most easily.
        applies_to: high
        quote: In most situations, an intake of feed is achieved most easily with a crumble.
    page: null
    notes: Choice between mash and crumble; pellet also mentioned but not used. Both are presented as acceptable
      with good feeding management. No preference stated for these two.
    reviewed_by: CB
  - card_id: ross-ps-density-male-20wk
    parameter: stocking density for male parent stock from 20 weeks to depletion
    parameter_category: space_allowance
    unit: birds/m2
    range_low: 3.5
    range_high: 5.5
    range_quote:
      - Recommended stocking densities from 15 weeks of age to depletion.
      - table: Table 14
        columns:
          - Male, 20 weeks to depletion (birds/m2 [ft2/bird])
        row:
          - 3.5-5.5 (2.0-3.1)
        checked_by: CB
    output_end: high
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: unit
    other_end_reason: null
    other_end_quote: null
    management_conditions:
      - condition: Environment (ventilation) and management conditions (feeder and drinker space) must be
          appropriate for the stocking density to ensure optimal performance.
        applies_to: both
        quote: Environment (ventilation) and management conditions (feeder and drinker space) must be appropriate
          for the stocking density to ensure optimal performance.
    production_consequences: []
    page: null
    notes: Range from the '20 weeks to depletion' column for males. The table also gives a range for 15-20
      weeks (3-4) and a female range (4-8) which are rejected due to crowding cap.
    reviewed_by: CB


