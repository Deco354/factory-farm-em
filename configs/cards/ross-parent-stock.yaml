cards:
  - card_id: ross-litter-depth-brooding
    parameter: litter depth at chick placement in brooding area
    parameter_category: other
    unit: cm
    range_low: 2
    range_high: 5
    range_quote: litter material should be spread evenly to a depth of 2-5 cm (0.8-2 in).
    output_end: low
    output_reason_basis: quote
    output_end_reason: Litter depth can be reduced where litter disposal is an issue.
    output_end_quote: Litter depth can also be reduced where litter disposal is an issue.
    other_reason_basis: quote
    other_end_reason: Thinner litter requires ensuring correct floor temperature, so thicker litter helps
      maintain temperature.
    other_end_quote: Where a thinner layer of litter is used, it is essential that the correct floor temperature
      (28°C - 30°C [82°F - 86°F]) is achieved prior to chick arrival.
    management_conditions:
      - condition: Where floor feeding is to be practiced after brooding, litter depth should not exceed 4
          cm
        applies_to: both
        quote: Where floor feeding is to be practiced after brooding, litter depth should not exceed 4 cm
          (1.6 in).
      - condition: With thinner litter, ensure correct floor temperature is achieved
        applies_to: low
        quote: Where a thinner layer of litter is used, it is essential that the correct floor temperature
          (28°C - 30°C [82°F - 86°F]) is achieved prior to chick arrival.
    production_consequences: [ ]
    page: null
    notes: The high end (5 cm) is the maximum; the manual warns against exceeding it. The low end is acceptable
      for cost reasons.
    reviewed_by: CB

  - card_id: ross-daylength-reduction-age
    parameter: Age at which constant 8-hour daylength is reached during rearing
    parameter_category: environment
    unit: days
    range_low: 10
    range_high: 21
    range_quote: Constant 8-hour daylengths should be reached by 10 days of age. However, if problems have
      regularly occurred with early body-weight gain, the reduction to a constant daylength may be more
      gradual so that 8 hours is not reached until 21 days.
    output_end: low
    output_reason_basis: quote
    output_end_reason: resolves many production problems (e.g., delayed sexual maturity, high female body
      weight, poor flock uniformity and high feed consumption)
    output_end_quote: resolves many production problems (e.g., delayed sexual maturity, high female body
      weight, poor flock uniformity and high feed consumption)
    other_reason_basis: quote
    other_end_reason: to maximize use of the extended program
    other_end_quote: Males must have access to ad lib feed during this period to maximize use of the extended
      program
    management_conditions:
      - condition: If problems have regularly occurred with early body-weight gain, use the more gradual reduction
          to 21 days
        applies_to: high
        quote: if problems have regularly occurred with early body-weight gain, the reduction to a constant
          daylength may be more gradual so that 8 hours is not reached until 21 days.
      - condition: Males must have access to ad lib feed during this period
        applies_to: high
        quote: Males must have access to ad lib feed during this period to maximize use of the extended program
    production_consequences: [ ]
    page: null
    notes: The 10-day end is the standard recommendation; the 21-day end is explicitly allowed under a specific
      condition. Both ends are acceptable within the manual's guidance.
    reviewed_by: CB

