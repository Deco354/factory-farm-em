# Parameter cards: Guidelines for Cage-Free Housing
# Every quote must match the cleaned book text (whitespace differences are ignored).
# Check with:
#   uv run python -m fragile_compassion.sft_document_generation.cards configs/cards/cobb_broiler_2021.yaml
#
# Reason rules: a `quote` reason must be a close paraphrase of that end's quote and add
# nothing to it. A `unit` reason is left empty; the checker prints the fixed sentence used.
# Set reviewed_by only after a second reader has compared every reason with its quote.
#
# Table values: quote a table row as a mapping (table / columns / row / checked_by).
# See the docstring at the top of cards.py.
#
# Checklist for a strong card
# 1. Two ends, both stated as acceptable, with both numbers in the range quote or
#    quotes. Never fill in an end yourself.
# 2. A meaningful gap between them. 28 versus 42 is a real decision; 28 versus 30
#    would hardly differ.
# 3. The source doesn't argue against the output end. If the quote says the low end
#    is "ideal," the high end isn't really acceptable practice.
# 4. Each reason can be traced to a quote, or to the fixed unit sentence for density
#    and per-equipment cards.
# 5. The parameter text matches the quote's scope, including qualifiers like climate,
#    house type or bird age.
# 6. Enough content for each end, roughly balanced: a condition or consequence or two
#    per end, quoted.
# 7. An accurate card ID, since it shows up in every record ID and in citations.
# 8. A trade-off: the two ends must differ in who benefits. Settings where the farmer
#    and the animals want the same thing (water quality, temperature, ventilation,
#    nutrient specs, biosecurity) don't make cards.

source:
  title: "Guidelines for Cage Free Housing"
  edition: "2017"
  domain: poultry_production
  species: "laying hens"          # shown to the prompt and response writers
  sector: layer
  mode: animal
  jurisdiction: US
  book_text: "context/cleaned/Guidelines for Cage-Free Housing_cleaned.txt"

cards: []

# Parked: kept for reference, not generated (the loader reads only `cards`).
parked:
  - card_id: guidelines-floor-space-per-hen
    why: >-
      Two minimums for different housing systems (1.0 aviary/slatted, 1.5 single-level
      litter), not two acceptable choices for one farm; recommending 1.0 in a litter system
      breaks the guideline. Also no layer personas exist yet.
    parameter: usable floor space per hen in cage-free housing systems (multi-tiered aviaries and partially
      slatted systems vs single-level all-litter floor systems)
    parameter_category: space_allowance
    unit: sq. ft.
    range_low: 1
    range_high: 1.5
    range_quote:
      - In multi-tiered aviaries and partially slatted systems, a minimum of 1.0 sq. ft. of usable floor space
        per hen must be allocated.
      - In a single-level all-litter floor system where hens have limited access to vertical space, the usable
        floor space allocation per hen shall be increased to a minimum of 1.5 sq. ft. per hen.
    output_end: low
    output_reason_basis: unit
    output_end_reason: null
    output_end_quote: null
    other_reason_basis: quote
    other_end_reason: Single-level all-litter floor systems provide limited vertical space, so hens need
      more floor space.
    other_end_quote: In a single-level all-litter floor system where hens have limited access to vertical
      space, the usable floor space allocation per hen shall be increased to a minimum of 1.5 sq. ft. per
      hen.
    management_conditions: [ ]
    production_consequences: [ ]
    page: null
    notes: The low end (1.0) applies only to systems with vertical space access (multi-tiered aviaries,
      partially slatted); the high end (1.5) applies to single-level all-litter systems with limited vertical
      access. Both are stated as minimums, so the range is conditional on system type.
    reviewed_by: null
