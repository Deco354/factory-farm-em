# The judging methods `fc rejudge` and `fc reading-pack --rejudge` run on stored Betley
# answers (#123; docs/judge-selection.md, Part C), and which methods each command runs.
#
# A method is one way of judging an answer: Betley's own prompts (`setup: betley`), or the
# label rubric (`setup: rubric`), with a judge file and a number of replies per pass
# (`samples`, averaged for numbers, majority vote for labels). Every run records this file,
# the judge files and the rubric in full beside its rows (`.meta.json`).
#
# Rules, checked when the file is read: names are lower-case words joined by single `_`;
# `samples` above 1 needs a judge temperature above 0; a rubric method needs an odd
# `samples`; a method that `repeats` another is a rubric method with that one's judge file and
# `samples`; the two lists name only methods defined here.
#
# Before its paid calls, a run sends each judge one test call. A judge that fails it (a
# missing key, a key without access to the model, a model shut down) stops the run, unless
# its method says `optional: <why a run may go on without it>`: then the run skips that
# method and judges with the rest.
#
# A method's scores are kept under its name. To change a method's judge, samples or the
# rubric it uses, give it a new name: a re-run refuses to mix old and new scores under one.
# The rubric methods are named for the rubric's version. Files judged before v3 hold v2's
# scores under `rubric`, `rubric_k5` and `rubric_replay`. Their reports still show them, but
# those methods are gone from here: they would now judge with v3.

# The label rubric the rubric methods use, and the fine-tuning domain its in-domain
# question names (a key of the rubric file's `domains`).
rubric: configs/betley_rubric.yaml
domain: unpop

methods:
  # Betley's prompts with stage 3's own judge, re-run: it shows how repeatable that
  # judging is (the report gives it a note, not a column).
  replay:    {setup: betley, judge: configs/judge.yaml}
  # Betley's prompts, 10 replies per pass averaged: the sampled stand-in for Betley's
  # logprob readout.
  sampled10: {setup: betley, judge: configs/judge.sampled.yaml, samples: 10}
  # The label rubric (v3, with #152's severity rules), one reply per pass.
  rubric_v3:    {setup: rubric, judge: configs/judge.yaml}
  # The label rubric, 5 replies per pass: labels by majority vote, severity averaged.
  rubric_v3_k5: {setup: rubric, judge: configs/judge.sampled.yaml, samples: 5}
  # The rubric's single pass again, unchanged, on answers `rubric_v3` judged already: how
  # often one pass gives the same category, severity, verdict and in-domain call (#150).
  # `repeats` names the method it judges again. A run refuses it unless the rows hold that
  # method's scores, judged with the same prompts, judge settings and cutoff. The report gives
  # it a note, not a column. In neither list: run it with `--only rubric_v3_replay`.
  rubric_v3_replay: {setup: rubric, judge: configs/judge.yaml, repeats: rubric_v3}
  # Betley's prompts with Betley's own logprob readout (judge/logprob.py), from two judges
  # that can give it, each beside its text-mode twin: the twin separates what the model
  # changes from what the readout changes. DeepSeek V4 Pro is open-weight; gpt-4.1 is a known
  # reference that OpenAI shuts down on 2027-01-14 (docs/judge-selection.md, Part C), so its
  # two methods are optional.
  deepseek_v4_pro_logprobs: {setup: betley, judge: configs/judge.deepseek-v4-pro.logprobs.yaml}
  deepseek_v4_pro_text: {setup: betley, judge: configs/judge.deepseek-v4-pro.yaml}
  gpt41_logprobs:
    setup: betley
    judge: configs/judge.gpt-4.1.logprobs.yaml
    optional: OpenAI shuts gpt-4.1 down on 2027-01-14
  gpt41_text:
    setup: betley
    judge: configs/judge.gpt-4.1.yaml
    optional: OpenAI shuts gpt-4.1 down on 2027-01-14

# What `fc rejudge --all` runs on every answer of an export (a full rescore).
full_rescore: [rubric_v3]
# What `fc reading-pack --rejudge` (and `fc rejudge --pack-seed`) runs on a pack's answers.
reading_pack:
  - replay
  - sampled10
  - rubric_v3
  - rubric_v3_k5
  - deepseek_v4_pro_logprobs
  - deepseek_v4_pro_text
  - gpt41_logprobs
  - gpt41_text
